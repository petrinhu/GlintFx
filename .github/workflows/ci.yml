name: CI

# Cinco alvos distintos, por ordem do lider (GODS_LAWS.md, L-04):
# Fedora, Ubuntu, CachyOS, Arch e Windows.
# Fedora e o ALVO PRIMARIO: e o sistema que o lider usa. O PINO EM
# fedora:44 FOI SOLTO em 27/08/2026, por ordem dele (ESCOPO.md S1,
# verbatim "solte para latest estavel" e depois "ponha todos como
# latest e instale a ferramenta nos que precisarem"): a matriz inteira
# usa :latest agora, nao so os alvos que ja estavam assim. A razao do
# pino continua satisfeita, nao anulada: MEDIDO ao vivo em 27/08/2026
# que fedora:latest e a MESMA versao 44 da maquina dele, com a mesma
# ferramenta de build na mesma versao (4.3.0) - o alvo primario ainda
# falha quando a maquina dele falharia, so que agora acompanha sozinho
# quando ele atualizar, em vez de exigir alguem subindo o numero a
# mao. Os demais alvos sao de portabilidade.
# CachyOS NAO e coberto pelo job de Arch: imagem propria, repositorios
# proprios, toolchain propria. Verde no Arch nao autoriza declarar
# CachyOS suportado.
#
# GODS_LAWS.md L-23, os quatro portoes, FUND-4: portao 1 (-Werror) esta
# em TODO build abaixo (linux e windows, via -DGLINTFX_WERROR=ON / /WX);
# portao 2 (ASan/UBSan) e o job `sanitizer`; portao 3 (analise estatica)
# e o job `lint`; portao 4 (scan de segredo) e o job `gitleaks`. Os tres
# jobs novos rodam so no Fedora, alvo primario (L-04), :latest desde
# 27/08/2026 - nao
# nos quatro alvos Linux da matriz - porque nenhum deles prova algo
# especifico de distro: clang-tidy/cppcheck/gitleaks analisam a mesma
# arvore de codigo-fonte em qualquer lugar, e ASan/UBSan e comportamento
# de runtime do compilador, ja coberto pelo GCC do alvo primario. `lint`
# e `sanitizer` chamam tools/preci.sh --lint-only/--sanitizer-only, a
# mesma logica de estagio que um desenvolvedor roda localmente (TESTES.md
# T15.2) - nao ha segunda copia da logica de estagio vivendo so aqui.
#
# GATE-DEBUG (TODO.md, DECISOES_AUTONOMAS.md D4, GODS_LAWS.md L-40): job
# `debug`, mesmo padrao do job `sanitizer` acima (so Fedora, alvo
# primario). Todo OUTRO job desta matriz configura com
# -DCMAKE_BUILD_TYPE=Release, que define NDEBUG - todo assert() do
# produto compilava para nada, em toda parte, ate este job existir. `debug`
# chama tools/preci.sh --debug-only, que conta os assert() de produto na
# arvore rastreada (reprova em zero, L-40) e so entao configura
# -DCMAKE_BUILD_TYPE=Debug (NDEBUG indefinido) e roda a suite inteira -
# nao um mecanismo alternativo que reencena as precondicoes por outro
# caminho (decisao D4, explicitamente recusou essa saida).
#
# CI-CONSUME (decisao do lider, relatada pelo coordenador): compartilhado
# e estatico agora sao ENTRADAS INDEPENDENTES da matriz, em `linux` e em
# `windows`, por simetria - antes eram dois PASSOS sequenciais dentro da
# mesma entrada de matriz, e uma falha no compartilhado abortava o job
# inteiro, pulando o estatico sem rodar (aconteceu duas vezes na mesma
# tarde: CI-CONSUME e CI-CONSUME-2). `fail-fast: false`, ja presente no
# `linux`, so garante independencia ENTRE entradas de matriz - nunca
# ajudou aqui, porque compartilhado/estatico eram passos, nao entradas.
#
# CONTAGEM DE CELULAS, pedida explicitamente pelo lider - "cinco alvos x
# dois modos continua sendo dez": ANTES, `linux` tinha 4 entradas de
# matriz (Fedora, Ubuntu, Arch, CachyOS), cada uma rodando os dois modos
# como passos sequenciais = 4 job-runs cobrindo 8 celulas; `windows` era
# 1 job sem matriz, tambem dois modos como passos sequenciais = 1
# job-run cobrindo 2 celulas. Total: 5 job-runs, 10 celulas, mas so 5
# delas independentes de verdade (uma falha em qualquer passo
# compartilhado escondia o resultado do estatico irmao). DEPOIS: `linux`
# tem 8 entradas de matriz (4 alvos x 2 modos) e `windows` tem 2 (1 alvo
# x 2 modos) = 10 job-runs, 10 celulas, TODAS independentes - nenhuma
# celula da matriz se perdeu no caminho.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: ${{ matrix.nome }}
    runs-on: ubuntu-latest
    container: ${{ matrix.imagem }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # O g++ padrao do 24.04 e o 13.3, que da C++23 parcial
          # (__cplusplus=202100, sem <print>). Piso de toolchain do projeto
          # e GCC 14, medido em 21/08/2026: 14.2 devolve 202302.
          #
          # Oito entradas (4 alvos x 2 modos), nao quatro - CI-CONSUME:
          # compartilhado e estatico sao entradas DISTINTAS da matriz, nao
          # dois passos dentro da mesma entrada, para que uma falha no
          # compartilhado de um alvo nunca esconda o resultado do
          # estatico irmao (nem o de nenhum outro alvo - fail-fast: false
          # ja cobria isso entre alvos; agora cobre entre modos tambem).
          #
          # c_compiler, campo novo (PKG-NATIVE, 27/08/2026): antes desta
          # fatia nenhuma entrada passava -DCMAKE_C_COMPILER explicito - o
          # C ficava por deteccao implicita do CMake, que achava "cc" de
          # graca porque o PROPRIO pacote "cmake" do apt no Ubuntu 24.04
          # traz o GCC 13 default como dependencia transitiva. Trocar o
          # CMake do apt por um tarball oficial baixado à parte tirava essa
          # dependencia junto - MEDIDO ao vivo naquele dia, nao suposto:
          # com "cmake" fora da lista de pacotes, o mesmo container
          # Ubuntu que antes achava /usr/bin/cc (GCC 13.3) passou a
          # reportar "No CMAKE_C_COMPILER could be found". A correcao foi
          # nomear o C explicitamente, no mesmo espirito que "cc" (CXX) ja
          # era explicito. ⚠ Em 27/08/2026 o tarball do Kitware SAIU da
          # receita do Ubuntu (ver o comentario logo acima das entradas
          # Ubuntu, mais abaixo): "cmake" volta a entrar na lista de
          # pacotes do apt, porque ubuntu:latest ja atende o piso sozinho.
          # O campo c_compiler FICA mesmo assim, sem se tornar sobra: nao
          # ha garantia de que o pacote "cmake" do apt continue trazendo
          # GCC como dependencia transitiva pra sempre, e "gcc-14"
          # continua sem symlink "cc"/"gcc" proprio (companheiro
          # versionado de "g++-14", ja instalado por dependencia do
          # pacote mas sem symlink nenhum), e "cc" nos outros tres alvos, onde
          # o pacote "gcc" do dnf/pacman ja entrega "/usr/bin/cc" ou
          # "/usr/sbin/cc" direto - MEDIDO nos tres, nao suposto.
          #
          # python3 no instalar de Fedora/Ubuntu/Arch (DEPZERO-TRACE,
          # GODS_LAWS.md L-07/L-40, achado do bloqueador de 29/08/2026):
          # tests/CMakeLists.txt registra dep_zero_trace/dep_zero_trace_
          # selftest com find_program(...NAMES python3 python REQUIRED) -
          # REQUIRED derruba o CONFIGURE inteiro se o interprete faltar,
          # entao a instalacao aqui e pre-condicao obrigatoria, nao
          # cosmetica. MEDIDO ao vivo, 29/08/2026, container fresco de
          # cada distro, PACOTE POR PACOTE (nao presumido igual nos
          # quatro): Fedora e Ubuntu tem pacote "python3" (dnf/apt,
          # confirmado expondo /usr/sbin/python3 e /usr/bin/python3
          # respectivamente); Arch NAO tem pacote "python3" - o nome do
          # pacote la e "python" (pacman), que entrega o binario
          # "python3" tambem (confirmado, /usr/sbin/python3). CachyOS
          # (abaixo) NAO ganhou a entrada: python3 3.14.7 ja vem de
          # fabrica na imagem, confirmado no mesmo dia - acrescentar
          # aqui seria pacote redundante, nao correcao. Fail-closed por
          # decisao consciente (REQUIRED, nao um "se existir, usa"): a
          # lei da casa de 25/08/2026 e clara - portao que degrada
          # calado e pior que portao ausente; se o nome de pacote mudar
          # num destes gerenciadores no futuro, o configure falha alto
          # e cedo, nao o dep_zero_trace sozinho ficando vermelho.
          #
          # Windows (job `windows`, abaixo): NAO precisou de linha nova.
          # Python vem de fabrica no runner windows-latest, documentado
          # (actions/runner-images, Windows2025-Readme.md, "Python
          # 3.12.10" na secao Language and Runtime) - mas essa e
          # documentacao do FABRICANTE da imagem, nunca execucao real
          # verificada por esta sessao: nao ha runner Windows disponivel
          # nesta maquina Linux para confirmar se o comando exposto e
          # "python3", "python", ou os dois. find_program(...NAMES
          # python3 python REQUIRED) (tests/CMakeLists.txt) tenta os
          # dois nomes justamente por essa incerteza residual - e a
          # mitigacao de design, nao uma confirmacao de que funciona.
          # Se a primeira execucao real no Windows reprovar aqui,
          # é a estreia que mede o nome certo, nao suposicao.
          - nome: Fedora (primario) - compartilhado
            cc: c++
            c_compiler: cc
            imagem: fedora:latest
            instalar: >-
              dnf -y install gcc-c++ cmake ninja-build pkgconf-pkg-config git
              wayland-devel wayland-protocols-devel python3
            modo: compartilhado
            builddir: build-shared
            shared_flag: ""
          - nome: Fedora (primario) - estatico
            cc: c++
            c_compiler: cc
            imagem: fedora:latest
            instalar: >-
              dnf -y install gcc-c++ cmake ninja-build pkgconf-pkg-config git
              wayland-devel wayland-protocols-devel python3
            modo: estatico
            builddir: build-static
            shared_flag: "-DBUILD_SHARED_LIBS=OFF"
          # Ubuntu deixou de precisar de instalacao manual de CMake em
          # 27/08/2026: a imagem passou de ubuntu:24.04 (pinada) para
          # ubuntu:latest, por ordem do lider (ESCOPO.md S1, PKG-NATIVE
          # decisao 7/9). MEDIDO ao vivo neste dia contra um container
          # ubuntu:latest real, nao suposto: a imagem hoje e o Ubuntu
          # 26.04 ("Resolute Raccoon"), e `apt-get install cmake` da
          # 4.2.3 - acima do piso de CMake 4.1 que
          # cmake_pkg_config(IMPORT/POPULATE) exige (CMakeLists.txt,
          # L-01 daquele arquivo). O leitor caseiro do tarball do
          # Kitware, que existia so por causa do 3.28.3 do 24.04, foi
          # removido: "cmake" volta a entrar na lista de pacotes do
          # apt, e nada mais baixa nada da internet neste passo. Fedora
          # (4.3.0), Arch e CachyOS (4.4.2 os dois) continuam acima do
          # piso pelo proprio dnf/pacman - MEDIDO, sem passo extra
          # algum. Windows continua sendo o UNICO dos cinco alvos que
          # ainda precisa da instalacao manual (ver o job `windows`
          # abaixo) - PACKAGING.md, "CMake version requirement", carrega
          # a ressalva completa, junto com a nota de que a versao
          # antiga do Ubuntu (24.04, ainda um alvo real para quem
          # instala pelo apt dele) deixou de ser exercitada pelo nosso
          # CI a partir desta fatia.
          - nome: Ubuntu - compartilhado
            cc: g++-14
            c_compiler: gcc-14
            imagem: ubuntu:latest
            instalar: >-
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y
              g++-14 gcc-14 cmake ninja-build pkg-config git
              libwayland-dev libwayland-bin wayland-protocols python3
            modo: compartilhado
            builddir: build-shared
            shared_flag: ""
          - nome: Ubuntu - estatico
            cc: g++-14
            c_compiler: gcc-14
            imagem: ubuntu:latest
            instalar: >-
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y
              g++-14 gcc-14 cmake ninja-build pkg-config git
              libwayland-dev libwayland-bin wayland-protocols python3
            modo: estatico
            builddir: build-static
            shared_flag: "-DBUILD_SHARED_LIBS=OFF"
          - nome: Arch - compartilhado
            cc: c++
            c_compiler: cc
            imagem: archlinux:latest
            instalar: >-
              pacman -Syu --noconfirm gcc cmake ninja pkgconf git
              wayland wayland-protocols python
            modo: compartilhado
            builddir: build-shared
            shared_flag: ""
          - nome: Arch - estatico
            cc: c++
            c_compiler: cc
            imagem: archlinux:latest
            instalar: >-
              pacman -Syu --noconfirm gcc cmake ninja pkgconf git
              wayland wayland-protocols python
            modo: estatico
            builddir: build-static
            shared_flag: "-DBUILD_SHARED_LIBS=OFF"
          - nome: CachyOS - compartilhado
            cc: c++
            c_compiler: cc
            imagem: cachyos/cachyos:latest
            instalar: >-
              pacman -Syu --noconfirm gcc cmake ninja pkgconf git
              wayland wayland-protocols
            modo: compartilhado
            builddir: build-shared
            shared_flag: ""
          - nome: CachyOS - estatico
            cc: c++
            c_compiler: cc
            imagem: cachyos/cachyos:latest
            instalar: >-
              pacman -Syu --noconfirm gcc cmake ninja pkgconf git
              wayland wayland-protocols
            modo: estatico
            builddir: build-static
            shared_flag: "-DBUILD_SHARED_LIBS=OFF"
    steps:
      - name: Instalar toolchain
        run: ${{ matrix.instalar }}

      - uses: actions/checkout@v4

      # git config --global --add safe.directory (DEPZERO-TRACE, CAUSA 1
      # do bloqueador de estreia, GHA run 33248706044, branch
      # depzero-gate, 29/08/2026): dep_zero_test (check_dep_zero.sh)
      # nunca tinha rodado no servidor - nasceu num commit que nunca foi
      # empurrado - e morreu na propria estreia com "'git ls-files'
      # failed... (not a git repository, or git unavailable) - scan
      # refused, never assumed empty". O COMPORTAMENTO do portao esta
      # certo (recusar variar em vez de assumir arvore vazia e a lei,
      # GODS_LAWS.md L-40); a causa e do AMBIENTE. Confirmado no log
      # real, nao presumido: `actions/checkout@v4` ja roda `git config
      # --global --add safe.directory /__w/GlintFx/GlintFx` sozinho
      # (set-safe-directory: true, o default dele) - mas ISSO acontece
      # no processo Node.js que executa a ACTION, com o seu proprio
      # HOME, nao no `root` que executa os passos `run:` DENTRO do
      # container (`container: ${{ matrix.imagem }}`, sem `options:
      # --user` -> root por padrao). O git de dentro do container le o
      # PROPRIO gitconfig de root, que nunca recebeu aquela entrada -
      # dono do diretorio (o runner, fora do container) diferente do
      # dono do processo que le (root, dentro dele) e o git recusa por
      # protecao de "dubious ownership" (a mesma CVE-2022-24765 que os
      # jobs `lint`/`sanitizer`/`debug`/`clang` ja tratam, alguns
      # commits atras, com esta MESMA linha - so o job `linux`, o unico
      # que de fato roda `dep_zero_test`/`ctest` completo, tinha ficado
      # de fora). Conserto no FLUXO DO SERVIDOR, nao no portao: o
      # comportamento do portao (recusar, nao assumir) e exatamente o
      # que GODS_LAWS.md L-40 exige, e mexer nele para "tolerar" a
      # ausencia de git seria abrir a porta que a lei fecha.
      - name: Configurar diretorio seguro do git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # PKG-NATIVE: falha o job cedo e com mensagem clara se o passo
      # "Instalar toolchain" acima nao alcancou o piso que
      # cmake_minimum_required(VERSION 4.1) exige (CMakeLists.txt) - sem
      # este print explicito, um Ubuntu que ainda achasse o cmake velho
      # do apt so falharia bem mais tarde, no proprio "cmake -S" do passo
      # de build, com uma mensagem que nao aponta para este passo.
      - name: Versoes da toolchain
        run: |
          set -eux
          ${{ matrix.cc }} --version
          ${{ matrix.c_compiler }} --version
          cmake --version
          ninja --version
          pkg-config --modversion wayland-client
          pkg-config --modversion wayland-protocols
          wayland-scanner --version

      # L-05: Linux e Wayland puro. Sem xdg-shell.xml nao se abre janela,
      # entao a ausencia dele e falha de ambiente, nao detalhe.
      - name: Protocolos Wayland presentes
        run: |
          set -eu
          xml="$(pkg-config --variable=pkgdatadir wayland-protocols)/stable/xdg-shell/xdg-shell.xml"
          test -f "$xml" || { echo "FALTA xdg-shell.xml em $xml"; exit 1; }
          echo "ok: $xml"

      # L-03: C++23. Compila um fragmento minimo para provar o padrao,
      # nao apenas a versao impressa pelo compilador.
      - name: Padrao C++23 aceito
        run: |
          set -eux
          cat > /tmp/c23.cpp <<'CPP'
          #include <cstdio>
          constexpr int f() { if consteval { return 23; } else { return 0; } }
          int main() { static_assert(f() == 23); std::printf("c++%ld\n", __cplusplus); }
          CPP
          ${{ matrix.cc }} -std=c++23 -o /tmp/c23 /tmp/c23.cpp
          /tmp/c23

      # O ctest aqui cobre tambem o gate de consumo (consume_test), o de
      # embedding (embed_test, GODS_LAWS.md FIX-CONSUMO achados
      # A2/A3/A4/A6/A7), o de decisao de colocacao de DLL embutida
      # (embed_dll_colocation_test, EMBED-DLL - roda aqui tambem, nao so
      # no Windows, porque nao tem dependencia de SO nenhuma), o de
      # CMAKE_INSTALL_INCLUDEDIR nao-default (install_includedir_test,
      # FIX-CONSUMO-2 achado QA-1), o de layout de empacotador Debian-
      # multiarch (install_packager_layout_test, FIX-CONSUMO-2 achado
      # QA-4; FIX-CONSUMO-3 secao 5: agora tambem prova o caminho
      # zero-flag nativamente onde o compilador reporta arquitetura
      # multiarch), o de colisao de nome de alvo (no_target_collision_test,
      # FIX-CONSUMO-2 achado QA-3) e o de OUTPUT_NAME/link cru
      # (output_name_test, FIX-CONSUMO-3 achado QA-2-2): todos foram
      # registrados em tests/CMakeLists.txt e rodam sob QUALQUER modo em
      # que este build/ tenha sido configurado, o que e exatamente o
      # eixo shared/static que matrix.modo agora exercita como entradas
      # separadas, nao mais como dois passos da mesma entrada (CI-CONSUME).
      # -DGLINTFX_WERROR=ON: GODS_LAWS.md L-23 portao 1 ("zero aviso de
      # compilacao em todo commit"), em todo build deste job a partir do
      # FUND-4 - ausente ate aqui (cmake/GlintfxOptions.cmake:11 tinha o
      # default OFF e nenhum passo deste arquivo o ligava).
      # -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} (PKG-NATIVE, 27/08/2026):
      # explicito em toda entrada agora, pelo mesmo motivo que
      # CMAKE_CXX_COMPILER ja e - ver o proprio comentario de
      # matrix.c_compiler acima pelo achado que forcou isso (o Ubuntu
      # perdeu um "cc" que so existia de graca via dependencia transitiva
      # do pacote apt "cmake", removido desta lista em favor do tarball
      # oficial do Kitware).
      # CC=${{ matrix.c_compiler }} (PKG-NATIVE, 27/08/2026): tests/tools/
      # check_pkgconfig_validate.sh (pkgconfig_validate_test, run by the
      # ctest line below) does its OWN separate `cmake -S`/`-B`
      # reconfigures of a throwaway build directory - CMAKE_CXX_COMPILER
      # reaches it as its second command-line argument
      # (tests/CMakeLists.txt), but there was never a channel for a C
      # compiler. Exporting CC here, at job-step level, is that channel:
      # the script reads it from the environment (see its own
      # "C_COMPILER_FLAG" comment) rather than tests/CMakeLists.txt
      # growing a third positional argument this fatia's own file scope
      # does not include.
      - name: Build e testes (${{ matrix.modo }})
        env:
          CC: ${{ matrix.c_compiler }}
        run: |
          set -eux
          cmake -S . -B ${{ matrix.builddir }} -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cc }} -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} ${{ matrix.shared_flag }} -DGLINTFX_WERROR=ON
          cmake --build ${{ matrix.builddir }}
          ctest --test-dir ${{ matrix.builddir }} --output-on-failure

  windows:
    name: Windows - ${{ matrix.modo }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Duas entradas, nao mais dois passos dentro de uma - mesma
          # razao do job `linux` acima (CI-CONSUME).
          - modo: compartilhado
            builddir: build-shared
            shared_flag: ""
          - modo: estatico
            builddir: build-static
            shared_flag: "-DBUILD_SHARED_LIBS=OFF"
    steps:
      - uses: actions/checkout@v4

      # PRECI-WIN-SELFTEST (03/09/2026, GODS_LAWS.md L-36/L-40): tools/
      # preci.ps1 - the local mirror of this whole job - had NO step
      # anywhere in this file calling it (measured: `grep -c
      # 'preci.ps1'` against this file was 0 before this fatia) and no
      # -Selftest of its own, unlike tools/preci.sh's Linux twin
      # (--selftest, wired into tests/CMakeLists.txt's preci_selftest
      # ctest case). Placed first, right after checkout and before any
      # MSVC/CMake preparation: -Selftest needs only `git` (already on
      # this runner) against disposable throwaway repos under
      # $env:TEMP, never $rootDir or a real build, so a regression here
      # fails fast without paying for the heavy steps below. Runs once
      # per matrix entry (compartilhado/estatico), same accepted shape
      # as "Diagnostico pkg-config no Windows" and "Padrao C++23
      # aceito" further down in this job - its result never depends on
      # matrix.modo. See tools/preci.ps1's own PRECI-WIN-SELFTEST
      # comment block for exactly what this covers and what it declares
      # out of scope.
      - name: preci.ps1 -Selftest (${{ matrix.modo }})
        shell: pwsh
        run: tools/preci.ps1 -Selftest

      # PKG-NATIVE (27/08/2026, updated same day when the matrix moved to
      # :latest): windows-latest is now the ONLY one of the five supported
      # platforms (GODS_LAWS.md L-04) whose factory CMake does not reach
      # the 4.1 floor cmake_pkg_config(IMPORT/POPULATE) needs
      # (CMakeLists.txt's own cmake_minimum_required comment) - MEASURED,
      # not assumed: actions/runner-images' own Windows2025-Readme.md
      # (fetched 27/08/2026) names "CMake 3.31.6" as this image's bundled
      # version. Ubuntu USED to need the same fix shape (the `linux` job's
      # `ubuntu:24.04` entries), but that recipe was retired the same day
      # the whole matrix moved to `:latest`: `ubuntu:latest` ships CMake
      # above the floor already, measured (see the comment right above the
      # Ubuntu matrix entries in the `linux` job). This step downloads the
      # official Kitware zip from cmake.org/download, prepended to PATH
      # via $GITHUB_PATH so every later step's plain "cmake" call (this
      # whole job never spells out a full path) picks it up - no
      # third-party GitHub Action (this project's own convention already
      # states "sem action de terceiro: o proprio CMake localiza o
      # MSVC", a few steps below). 4.1.6, a pinned patch release, for the
      # same reason it always was: testing the true floor
      # cmake_minimum_required declares, not a newer version that
      # could mask a 4.1-only bug.
      - name: Instalar CMake >= 4.1 (Windows)
        shell: pwsh
        run: |
          $cmakeVersion = "4.1.6"
          $zipUrl = "https://github.com/Kitware/CMake/releases/download/v$cmakeVersion/cmake-$cmakeVersion-windows-x86_64.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP "glintfx-cmake.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "glintfx-cmake"
          Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractDir
          $cmakeRoot = Get-ChildItem -Path $extractDir -Directory | Select-Object -First 1
          $cmakeBinDir = Join-Path $cmakeRoot.FullName "bin"
          if (-not (Test-Path (Join-Path $cmakeBinDir "cmake.exe"))) {
            Write-Error "cmake.exe not found under $cmakeBinDir after extracting $zipUrl"
            exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value $cmakeBinDir

      - name: Versoes da toolchain
        shell: pwsh
        run: cmake --version

      # CI-WIN-ENV (27/08/2026, GODS_LAWS.md L-42): prepara o ambiente do
      # compilador ANTES de qualquer "cmake -S/-B" deste job. O gerador
      # que este job passa a usar abaixo (Ninja, ver CI-WIN-GEN mais
      # abaixo) e de linha de comando e NAO localiza o cl.exe sozinho -
      # so o gerador de IDE fazia isso, via VS Setup API. Aqui achamos a
      # instalacao com vswhere.exe (ja presente na imagem do executor,
      # sem action de terceiro) e rodamos vcvarsall.bat para x64,
      # exportando cada variavel resultante (PATH, INCLUDE, LIB etc.)
      # para os passos seguintes via $env:GITHUB_ENV
      # (scivision.dev/github-actions-use-msvc). O passo FALHA se a
      # instalacao nao for encontrada - nunca segue em silencio, que foi
      # o que aconteceu na primeira rodada (caiu para NMake sem ambiente
      # preparado).
      - name: Preparar ambiente do compilador (MSVC x64)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $installPath) {
            Write-Error "Nenhuma instalacao do MSVC com o componente VC.Tools.x86.x64 foi encontrada por vswhere."
            exit 1
          }
          $vcvarsall = Join-Path $installPath "VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvarsall)) {
            Write-Error "vcvarsall.bat nao encontrado em $vcvarsall"
            exit 1
          }
          $envDump = cmd /c "`"$vcvarsall`" x64 && set"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "vcvarsall.bat x64 falhou com codigo $LASTEXITCODE"
            exit 1
          }
          foreach ($line in $envDump) {
            if ($line -match '^([^=]+)=(.*)$') {
              Add-Content -Path $env:GITHUB_ENV -Value "$($matches[1])=$($matches[2])"
            }
          }

      # PKG-WIN-SCOPE: passo PERMANENTE, independente de matrix.builddir
      # (roda identico nas duas entradas, como "Padrao C++23 aceito"
      # abaixo) - colhe dado sobre pkg-config/pkgconf neste executor e
      # NUNCA falha o job (sempre exit 0 dentro do proprio script). Fica
      # mesmo com glintfx.pc desinstalado do Windows: e o que transforma
      # a proxima pergunta sobre pkg-config no Windows em leitura de log,
      # nao em quarta adivinhacao.
      - name: Diagnostico pkg-config no Windows (${{ matrix.modo }})
        shell: pwsh
        run: tools/ci/diagnose-win-pkgconfig.ps1

      # Nao ha mais "o proprio CMake localiza o MSVC" para este passo:
      # essa garantia so vale para o generator de IDE (Visual Studio NN),
      # que saiu da jogada (ver CI-WIN-GEN abaixo). Quem localiza o MSVC
      # agora e o passo "Preparar ambiente do compilador (MSVC x64)"
      # acima (CI-WIN-ENV), rodado antes de qualquer "cmake -S/-B" do
      # job. Sonda independente de modo (nao usa glintfx, nao le
      # matrix.builddir); roda uma vez por entrada de matriz agora, nao
      # mais uma vez por job - custo aceito da independencia
      # (CI-CONSUME).
      #
      # CI-WIN-GEN (27/08/2026, MEDIDO no run 33114884257; generator
      # trocado de Visual Studio para Ninja em 27/08/2026): sem -G, o
      # CMake 4.1.6 recem-instalado (passo "Instalar CMake >= 4.1"
      # acima) escolheu "NMake Makefiles" como generator padrao neste
      # shell pwsh comum (nao um Developer Command Prompt), e o passo
      # morreu com "'nmake' '-?' failed with: no such file or
      # directory" - nmake nao esta no PATH fora de um shell com
      # vcvarsall ja rodado. O generator de IDE (Visual Studio NN) foi
      # cogitado primeiro por localizar o MSVC sozinho via VS Setup API,
      # sem vcvarsall, mas saiu de cena: a versao minima de CMake que
      # este projeto declara (cmake_minimum_required) nao o conhece
      # nesta imagem. A troca definitiva foi para Ninja - generator de
      # LINHA DE COMANDO, de CONFIGURACAO UNICA - com o ambiente ja
      # preparado pelo passo CI-WIN-ENV acima (vcvarsall x64 exportado
      # via $env:GITHUB_ENV). Configuracao unica muda o contrato: a
      # config (Release) passa a ser escolhida ao CONFIGURAR
      # (-DCMAKE_BUILD_TYPE=Release), nunca mais ao construir
      # (--config) nem ao testar (-C) - os generators de IDE tinham
      # config so nesses dois pontos, e por isso as flags equivalentes
      # sumiram dos passos "cmake --build" e "ctest" abaixo.
      - name: Padrao C++23 aceito
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path probe | Out-Null
          @'
          #include <cstdio>
          constexpr int f() { if consteval { return 23; } else { return 0; } }
          int main() { static_assert(f() == 23); std::printf("ok\n"); }
          '@ | Set-Content probe/main.cpp
          @'
          cmake_minimum_required(VERSION 3.25)
          project(probe CXX)
          set(CMAKE_CXX_STANDARD 23)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          add_executable(probe main.cpp)
          '@ | Set-Content probe/CMakeLists.txt
          cmake -S probe -B probe/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build probe/build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Get-ChildItem -Recurse -Filter probe.exe probe/build)[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -Recurse -Force probe

      # ctest aqui roda apenas os testes da propria arvore: consume_test/
      # embed_test/embed_dll_colocation_test's shell-dependent siblings
      # sao POSIX sh e nao compilados neste job (tests/CMakeLists.txt
      # guarda a maioria com if(UNIX); embed_dll_colocation_test e a
      # excecao PURPOSEFUL sem if(UNIX) - roda aqui tambem, ver
      # tests/CMakeLists.txt), por isso os passos "Consumo instalado" e
      # "Consumo embutido" abaixo fecham o caminho de consumo do Windows
      # com um script dedicado cada um (GODS_LAWS.md FIX-CONSUMO,
      # achados A2/A3: o caminho dllimport so existe fora da arvore; e
      # achado A7/FIX-CONSUMO-2 achado QA-2 para o embedding - CI-CONSUME
      # fechou a lacuna em que embed_test so tinha equivalente Linux).
      # -DGLINTFX_WERROR=ON: GODS_LAWS.md L-23 portao 1. No MSVC,
      # cmake/GlintfxCompileOptions.cmake ja mapeia esta mesma flag para
      # /WX (avisos como erro) - nao ha um segundo flag /WX a passar aqui.
      # -G Ninja: mesmo motivo do CI-WIN-GEN no passo "Padrao C++23
      # aceito" acima - sem -G explicito, o CMake 4.1.6 cai para NMake
      # Makefiles (generator de linha de comando, que tambem exige
      # vcvarsall) neste shell pwsh comum. O ambiente ja vem preparado
      # pelo passo CI-WIN-ENV no topo do job. Ninja e de configuracao
      # unica: a config (Release) e escolhida aqui, ao configurar
      # (-DCMAKE_BUILD_TYPE=Release) - por isso o passo seguinte
      # ("cmake --build") e o ctest logo abaixo nao levam mais
      # "--config"/"-C Release": esse par de flags e do generator de
      # IDE (multi-config) que este job usava antes da fatia CI-WIN-GEN
      # e que saiu de cena.
      #
      # FATO DE PRODUTO (CI-WIN-GEN, 27/08/2026): com a versao minima de
      # CMake que este projeto declara, o consumidor de Windows NAO
      # constroi pelo caminho de projeto da Microsoft (generator
      # "Visual Studio NN") nesta versao do compilador instalada nesta
      # imagem - a ferramenta so passou a reconhecer esse generator na
      # versao seguinte. O caminho provado e o de linha de comando
      # (Ninja) com o ambiente do compilador preparado antes
      # (vcvarsall x64, via CI-WIN-ENV acima).
      - name: Build (${{ matrix.modo }})
        shell: pwsh
        run: |
          cmake -S . -B ${{ matrix.builddir }} -G Ninja -DCMAKE_BUILD_TYPE=Release ${{ matrix.shared_flag }} -DGLINTFX_WERROR=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build ${{ matrix.builddir }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # WIN-HANG: colhe evidencia real do runner (localizacao do .dll x
      # .exe, execucao direta com limite de tempo proprio) ANTES do
      # ctest tentar rodar version_test.exe - GODS_LAWS.md L-27, fato
      # antes de conserto. Nunca falha o job por si so; o passo de teste
      # seguinte e que decide passa/falha, agora limitado por
      # DART_TESTING_TIMEOUT (cmake/GlintfxTest.cmake) em vez do default
      # de 1500s do CTest. Roda para os dois modos agora (antes so
      # existia para o compartilhado): o estatico nunca tinha este
      # diagnostico, e um hang la seria tao real quanto no compartilhado.
      - name: Diagnostico Windows - layout de runtime (${{ matrix.modo }})
        shell: pwsh
        run: tools/ci/diagnose-win-runtime.ps1 -BuildDir ${{ matrix.builddir }}

      - name: Testes (${{ matrix.modo }})
        shell: pwsh
        run: |
          ctest --test-dir ${{ matrix.builddir }} --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # X-0-LOG (02/09/2026, GODS_LAWS.md L-40): o passo "Testes" acima roda
      # com --output-on-failure, que so mostra a saida de teste que REPROVA
      # - por definicao nunca mostra a saida da sonda win32_runner_probe_test
      # quando ela passa, e o produto dela E a saida (o que
      # CreateWindowExW/PeekMessageW/WM_SIZE/WM_ACTIVATE entregam neste
      # runner). Sem este passo a sonda passava e a medicao nunca chegava ao
      # log (medido no run 33642256048, job "Windows - compartilhado": so
      # "win32_runner_probe_test ... Passed 0.03 sec"). Roda nos dois modos
      # (compartilhado e estatico): tests/CMakeLists.txt registra a sonda
      # so sob if(WIN32), sem depender de BUILD_SHARED_LIBS, entao os dois
      # modos tem a mesma sonda pra imprimir - e por isso zero teste casando
      # aqui NUNCA e legitimo: este passo so roda dentro do job `windows`,
      # onde WIN32 e sempre verdadeiro, entao ctest -N contar zero so pode
      # significar registro quebrado (guarda if(WIN32) mexida) ou build sem
      # a sonda. GODS_LAWS.md L-40, piso de varredura nao-vazia: contou
      # zero, reprova - o passo "Testes" acima prova que os testes
      # REGISTRADOS passam, nunca que a sonda ESTA registrada; sumir do
      # CMake deixaria os dois passos verdes se este aqui tolerasse zero.
      # Com 1 ou mais, roda -V e deixa o codigo de saida propagar: reprovar
      # aqui significaria a sonda ter passado silenciosa no passo anterior
      # e falhar nesta segunda rodada minutos depois - reprovacao real, nao
      # mascarada por um "|| true" cego.
      - name: Saida verbosa da sonda de runner (${{ matrix.modo }})
        shell: pwsh
        run: |
          $listOutput = ctest --test-dir ${{ matrix.builddir }} -R win32_runner_probe_test -N
          $totalLine = $listOutput | Select-String -Pattern 'Total Tests:\s*(\d+)'
          $total = if ($totalLine) { [int]$totalLine.Matches[0].Groups[1].Value } else { 0 }
          if ($total -eq 0) {
            Write-Error "esperado ao menos 1 teste casando com win32_runner_probe_test neste job Windows (WIN32 e sempre verdadeiro aqui); ctest -N contou 0 - registro quebrado (tests/CMakeLists.txt) ou build sem a sonda."
            exit 1
          }
          ctest --test-dir ${{ matrix.builddir }} -V -R win32_runner_probe_test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # DEPZERO-PARITY-WIN / PORT-PRIVACY-WIN (GODS_LAWS.md L-04
      # reabertura de check_dep_zero.sh sub-check (c) e check_port_
      # privacy.sh sub-check (d) por paridade, 03/09/2026): ate aqui o
      # import table e o export table de glintfx.dll nunca tinham sido
      # lidos por ninguem - src/platform/win32/ (WIN-DISPLAY) so ganhou
      # um binario de verdade para inspecionar numa onda recente. Os
      # dois scripts abaixo sao os equivalentes Windows dos sub-checks
      # que ja rodam contra o .so no job `linux` (readelf -d / nm -D +
      # c++filt) - tools/ci/check-dep-zero-win.ps1 e tools/ci/check-
      # port-privacy-win.ps1 usam dumpbin.exe, que ja esta no PATH desde
      # o passo "Preparar ambiente do compilador (MSVC x64)" acima
      # (mesmo componente VC.Tools.x86.x64 que aquele passo ja exige via
      # vswhere - ver o header de cada script para a citacao medida
      # contra actions/runner-images/Windows2025-Readme.md). O
      # -SelfTest de cada script roda ANTES da checagem real, provando o
      # parser/allowlist contra texto sintetico no formato documentado
      # do dumpbin - a UNICA prova vermelha possivel fora do servidor
      # Windows real (maquina do autor nao tem Windows nem MSVC); a
      # checagem real contra o glintfx.dll de verdade, alguns passos
      # abaixo, e a estreia genuina desta trava - ver o header de cada
      # script para a limitacao declarada.
      - name: Dependencia zero (Windows) - autoteste do parser (${{ matrix.modo }})
        shell: pwsh
        run: tools/ci/check-dep-zero-win.ps1 -SelfTest

      - name: Dependencia zero (Windows) - importacoes do binario real (${{ matrix.modo }})
        shell: pwsh
        run: tools/ci/check-dep-zero-win.ps1 -Modo "${{ matrix.modo }}" -BuildDir "${{ matrix.builddir }}"

      - name: Privacidade de porta (Windows) - autoteste do parser (${{ matrix.modo }})
        shell: pwsh
        run: tools/ci/check-port-privacy-win.ps1 -SelfTest

      - name: Privacidade de porta (Windows) - exportacoes do binario real (${{ matrix.modo }})
        shell: pwsh
        run: tools/ci/check-port-privacy-win.ps1 -Modo "${{ matrix.modo }}" -BuildDir "${{ matrix.builddir }}"

      - name: Consumo instalado (${{ matrix.modo }})
        id: consumo_instalado
        shell: pwsh
        run: tools/ci/check-consume.ps1 -BuildDir ${{ matrix.builddir }} -PackageSrcDir tests/package

      # PKG-WIN-SCOPE, revertido por ordem do lider (27/08/2026): regression
      # gate for CMakeLists.txt calling glintfx_install_pkgconfig()/
      # glintfx_register_pkgconfig_validation() unconditionally again (the
      # if(UNIX) guard that used to protect "pkg-config has no role in
      # glintfx's Windows story today" is gone - see PACKAGING.md,
      # "Packaging on Windows"). Reads the SAME prefix the step above just
      # installed into (its `prefix` output), instead of installing a
      # second one - this is the whole reason that step now exposes it.
      - name: Com pkg-config no prefixo Windows (${{ matrix.modo }})
        shell: pwsh
        run: tools/ci/check-pkgconfig-installed.ps1 -InstalledPrefix "${{ steps.consumo_instalado.outputs.prefix }}"

      # Windows equivalent of tests/tools/check_embed.sh (embed_test,
      # UNIX-only in tests/CMakeLists.txt) - proves add_subdirectory
      # consumption, not just the installed package above. Its own
      # configure is independent of BuildDir/BUILD_SHARED_LIBS (same
      # shape as check_embed.sh's configure_embed(), which does not
      # inherit the parent build's mode either), so this step's outcome
      # does not vary between matrix.modo entries - it runs once per
      # entry regardless, mirroring embed_test's own execution shape on
      # Linux, where ctest registers and runs it once per configure
      # (build-shared and build-static) even though its result does not
      # depend on either mode.
      - name: Consumo embutido (${{ matrix.modo }})
        shell: pwsh
        run: tools/ci/check-embed.ps1 -GlintfxSourceDir . -EmbedSrcDir tests/embed

  # GODS_LAWS.md L-09 / TEST-WLCONT: prova, em CI, que o container de
  # teste com compositor Wayland dentro (tests/container/) e a mesma
  # imagem que roda localmente e que ela isola de verdade a superficie
  # do lider - nunca monta o XDG_RUNTIME_DIR nem o wayland-0 do host,
  # nunca monta /dev/uinput, nunca fala X11 (L-05). Bloqueante como os
  # demais jobs (L-18): job que nao consegue ficar verde nao entra no
  # push.
  wayland-container:
    name: Container Wayland isolado (TEST-WLCONT, L-09)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # ARCH-PORTS, TDD case R4: stages the REAL wayland_display_
      # adapter/err.cpp/err_code.cpp sources into tests/container/
      # _arch_ports_src/ (gitignored, regenerated every run) so the
      # image build below can COPY them without widening the docker
      # build context past tests/container/ - see prepare_arch_ports_
      # fixture.sh's own header comment for why.
      - name: Prepara a fixture ARCH-PORTS (R4)
        run: tests/container/prepare_arch_ports_fixture.sh "$(pwd)"

      - name: Marca o inicio do build da imagem
        id: build_image
        run: echo "inicio=$(date +%s)" >> "$GITHUB_OUTPUT"

      # Imagem construida sob demanda, com cache de camadas no cache
      # de Actions do proprio GitHub (`type=gha`) - decisao do CTO:
      # sem registry externo. `load: true` poe a imagem no daemon
      # docker local do runner, porque os passos seguintes falam com
      # ela via `docker run`/`docker exec`, nao via `docker push`.
      - uses: docker/build-push-action@v6
        with:
          context: tests/container
          file: tests/container/Containerfile
          tags: glintfx-wltest:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tempo de build da imagem
        run: |
          set -eu
          fim=$(date +%s)
          echo "tempo de build da imagem: $((fim - ${{ steps.build_image.outputs.inicio }}))s"

      # Fato medido ao vivo contra esta mesma imagem, nao suposto: o
      # kwin_wayland do Fedora carrega a capability de arquivo
      # cap_sys_nice=ep (`getcap /usr/bin/kwin_wayland`), e um
      # `docker run` default nao concede CAP_SYS_NICE - sem ela o
      # dbus-run-session falha o exec do kwin_wayland com "Operation
      # not permitted" antes mesmo de o compositor subir.
      # --cap-drop=ALL --cap-add=SYS_NICE (nao --cap-add puro): forma
      # estritamente menor, verificada ao vivo que ainda sobe o
      # compositor (revisao adversarial TEST-WLCONT, conserto 4). Nada
      # alem disso: sem --privileged, sem --pid=host, sem /dev/dri
      # (GODS_LAWS.md L-09 regra 4 - render por software, reproduzivel
      # em qualquer runner); check_isolation.sh confere esse HostConfig
      # exato por lista branca.
      - name: Sobe o compositor limpo (nenhuma montagem do host)
        run: |
          set -eux
          docker run -d --name glintfx-wltest-clean --cap-drop=ALL --cap-add=SYS_NICE glintfx-wltest:ci
          for _ in $(seq 1 30); do
            docker exec glintfx-wltest-clean pgrep -x kwin_wayland >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec glintfx-wltest-clean pgrep -x kwin_wayland

      # GODS_LAWS.md L-09 regra 5: provar o isolamento ANTES de
      # interagir. Este passo roda antes do smoke test de proposito.
      - name: Isolamento provado (controle positivo)
        run: tests/container/check_isolation.sh glintfx-wltest-clean glintfx-test

      - name: Smoke test - wayland-info dentro do container
        run: docker exec glintfx-wltest-clean smoke.sh glintfx-test

      # ARCH-PORTS, TDD case R4 (GODS_LAWS.md L-09/L-20 - integracao
      # DECLARADA, sem rebaixamento: este e o unico dos cinco vermelhos
      # da fatia que roda contra um compositor REAL). Passa
      # XDG_RUNTIME_DIR/WAYLAND_DISPLAY explicitamente ao `docker exec`
      # - o export feito dentro de run_compositor.sh (ENTRYPOINT) so
      # vale para AQUELE processo, nao e herdado por um exec novo,
      # mesmo padrao que smoke.sh (acima) ja segue para wayland-info.
      - name: ARCH-PORTS - conecta e desconecta via o adaptador real (R4)
        run: |
          docker exec \
            -e XDG_RUNTIME_DIR=/run/glintfx-test \
            -e WAYLAND_DISPLAY=glintfx-test \
            glintfx-wltest-clean arch_ports_connect_smoke

      # WL-DISPLAY fatia B, TDD case B (GODS_LAWS.md L-09/L-20 -
      # integracao DECLARADA contra compositor REAL, mesmo padrao do
      # passo R4 acima): registry_smoke.cpp e compilado na imagem
      # (Containerfile) contra as fontes reais de producao, e ate este
      # conserto (achado da revisao adversarial, GODS_LAWS.md L-36) so
      # existia dentro do binario - nunca executado em lugar nenhum, o
      # que nao e portao. Falha aqui (`docker exec` com saida != 0)
      # reprova este passo do job, o mesmo mecanismo de bloqueio de
      # todo outro passo desta matriz.
      - name: WL-DISPLAY fatia B - registry real dentro do container
        run: |
          docker exec \
            -e XDG_RUNTIME_DIR=/run/glintfx-test \
            -e WAYLAND_DISPLAY=glintfx-test \
            glintfx-wltest-clean registry_smoke

      # WL-DISPLAY fatia D, TDD case D: pump_smoke.cpp, mesmo padrao dos
      # dois passos acima. Roda ANTES da fatia C abaixo de proposito -
      # precisa do compositor deste container ainda vivo, e a fatia C e
      # exatamente o passo que o mata.
      - name: WL-DISPLAY fatia D - pump nao-bloqueante dentro do container
        run: |
          docker exec \
            -e XDG_RUNTIME_DIR=/run/glintfx-test \
            -e WAYLAND_DISPLAY=glintfx-test \
            glintfx-wltest-clean pump_smoke

      # WL-DISPLAY fatia C, TDD case C: fatal_error_smoke.cpp mata o
      # kwin_wayland DESTE MESMO container (pkill -x kwin_wayland de
      # DENTRO dele, nunca do host - GODS_LAWS.md L-09) e prova que o
      # adaptador sobrevive com platform_failure em vez de crash. Roda
      # por ULTIMO entre os smokes deste container de proposito: os
      # tres passos acima (smoke.sh, ARCH-PORTS, registry_smoke,
      # pump_smoke) todos precisam do compositor vivo, e depois deste
      # passo ele nao esta mais. O CONTAINER em si sobrevive ao teste -
      # run_compositor.sh deixou de rodar o compositor como PID 1
      # exatamente para isso (conserto desta mesma revisao,
      # run_compositor.sh's own header comment) - entao a limpeza no
      # fim do job continua alcancando este container normalmente.
      - name: WL-DISPLAY fatia C - erro fatal dentro do container
        run: |
          docker exec \
            -e XDG_RUNTIME_DIR=/run/glintfx-test \
            -e WAYLAND_DISPLAY=glintfx-test \
            glintfx-wltest-clean fatal_error_smoke

      # Tres controles negativos obrigatorios (revisao adversarial
      # TEST-WLCONT: FURO 1 montagem/device, FURO 2 --pid=host, FURO 3
      # padrao de barra final). Cada um TEM que ser acusado por
      # check_isolation.sh - se algum passar verde aqui, o proprio
      # gate esta quebrado (mesmo piso que tools/preci.sh --selftest
      # aplica aos seus proprios controles, GODS_LAWS.md L-23).
      # `docker create`, nunca `docker run`, de proposito: o
      # ENTRYPOINT jamais executa, entao mesmo o cenario mais perigoso
      # (--pid=host) nao chega a rodar processo nenhum - os tres
      # controles se apoiam so em `docker inspect`, o que
      # check_isolation.sh confere ANTES de qualquer `docker exec`.
      - name: Controle negativo 1 - montagem proibida (FURO 1/3)
        run: |
          set -eux
          docker create --name glintfx-wltest-poisoned-mount --cap-drop=ALL --cap-add=SYS_NICE \
            -v /tmp:/run/user/1000:ro glintfx-wltest:ci
          if tests/container/check_isolation.sh glintfx-wltest-poisoned-mount glintfx-test; then
            echo "ERRO: check_isolation.sh deveria ter acusado a montagem proibida" >&2
            exit 1
          fi
          echo "ok: montagem proibida foi acusada, como esperado"

      - name: Controle negativo 2 - device passado (FURO 1)
        run: |
          set -eux
          docker create --name glintfx-wltest-poisoned-device --cap-drop=ALL --cap-add=SYS_NICE \
            --device=/dev/uinput glintfx-wltest:ci
          if tests/container/check_isolation.sh glintfx-wltest-poisoned-device glintfx-test; then
            echo "ERRO: check_isolation.sh deveria ter acusado o --device proibido" >&2
            exit 1
          fi
          echo "ok: --device proibido foi acusado, como esperado"

      # O mais serio dos tres: sob --pid=host, um `pgrep` DENTRO do
      # container deixa de estar escopado ao container e passa a ver
      # todo o PID namespace do runner. `docker create` garante que
      # isso nunca chega a acontecer aqui - o container nunca inicia,
      # e o proprio HostConfig.PidMode="host" tem que bastar para
      # check_isolation.sh recusar antes de cogitar um `docker exec`.
      - name: Controle negativo 3 - --pid=host (FURO 2)
        run: |
          set -eux
          docker create --name glintfx-wltest-poisoned-pid --cap-drop=ALL --cap-add=SYS_NICE \
            --pid=host glintfx-wltest:ci
          if tests/container/check_isolation.sh glintfx-wltest-poisoned-pid glintfx-test; then
            echo "ERRO: check_isolation.sh deveria ter acusado --pid=host" >&2
            exit 1
          fi
          echo "ok: --pid=host foi acusado, como esperado"

      # Quarto controle negativo, achado de revisao adversarial pos-
      # ISO-BASELINE (a razao real da reescrita daquele portao):
      # `--security-opt systempaths=unconfined` nao mexe em nenhum dos
      # nove campos nomeados que os tres controles acima cobrem -
      # MaskedPaths e ReadonlyPaths (que ISO-BASELINE passou a medir
      # por CONTAGEM contra `nproc`, nao por lista fixa) sao os unicos
      # que se esvaziam quando o flag esta presente. O script antigo,
      # de antes do ISO-BASELINE, media isso por lista de campos
      # nomeados e dava exit 0 ("isolamento provado") com /proc/kcore
      # exposto - medido ao vivo pela revisao, nao suposto. Mesmo
      # padrao dos tres controles acima: `docker create`, nunca `docker
      # run` - o ENTRYPOINT nunca executa, o controle se apoia so em
      # `docker inspect`.
      - name: Controle negativo 4 - --security-opt systempaths=unconfined
        run: |
          set -eux
          docker create --name glintfx-wltest-poisoned-systempaths --cap-drop=ALL --cap-add=SYS_NICE \
            --security-opt systempaths=unconfined glintfx-wltest:ci
          if tests/container/check_isolation.sh glintfx-wltest-poisoned-systempaths glintfx-test; then
            echo "ERRO: check_isolation.sh deveria ter acusado --security-opt systempaths=unconfined" >&2
            exit 1
          fi
          echo "ok: --security-opt systempaths=unconfined foi acusado, como esperado"

      - name: Limpeza
        if: always()
        run: |
          docker rm -f glintfx-wltest-clean glintfx-wltest-poisoned-mount \
            glintfx-wltest-poisoned-device glintfx-wltest-poisoned-pid \
            glintfx-wltest-poisoned-systempaths || true

  lint:
    name: Lint (Fedora - clang-format, clang-tidy, cppcheck)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Instalar toolchain e ferramentas de lint
        run: >-
          dnf -y install gcc-c++ cmake ninja-build pkgconf-pkg-config git
          wayland-devel wayland-protocols-devel clang-tools-extra cppcheck

      - uses: actions/checkout@v4

      # PRECI-SELFTEST (03/09/2026, GODS_LAWS.md L-36/L-40): tools/
      # preci.sh --selftest nunca rodava em lugar nenhum. O teste
      # registrado, `preci_selftest` (tests/CMakeLists.txt), so nasce
      # quando clang-format/clang-tidy/cppcheck estao TODOS presentes -
      # e essa combinacao nunca acontecia: o job `linux` roda a suite
      # mas nao instala as tres ferramentas, e este job `lint` instala
      # as tres mas so chamava `--lint-only` (a analise de verdade,
      # nao o selftest que prova a analise). Este passo fecha a lacuna
      # com a MENOR mudanca possivel: reusa as ferramentas que o passo
      # acima ja instalou, sem exigir job novo. --selftest opera so
      # sobre tests/preci_fixtures/ (nunca sobre $BUILD_DIR, ver o
      # comentario do proprio script) - por isso vem ANTES de
      # `--lint-only` abaixo, que configura e builda a arvore inteira:
      # uma regressao no selftest falha rapido, sem pagar o build. O
      # lado Windows ganhou o gemeo dele (PRECI-WIN-SELFTEST, job
      # `windows`) na mesma fatia.
      - name: preci.sh --selftest
        run: |
          set -eux
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tools/preci.sh --selftest

      # GODS_LAWS.md L-23 portao 3 (analise estatica). Mesma logica de
      # estagio que tools/preci.sh roda localmente (TESTES.md T15.2) -
      # format, configure -Werror, build, clang-tidy, cppcheck, NOLINT.
      - name: preci.sh --lint-only
        run: |
          set -eux
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tools/preci.sh --lint-only

  # LACUNA 2 (GODS_LAWS.md L-04, medido pelo lider antes desta fatia):
  # o job `lint` acima roda em Fedora/Linux - src/platform/CMakeLists.txt
  # so entra em src/platform/win32/ quando WIN32 e verdadeiro
  # (if(UNIX)/elseif(WIN32), ver o proprio comentario daquele arquivo),
  # entao display_adapter.cpp/selected_display_adapter_check.cpp NUNCA
  # apareciam no compile_commands.json que o clang-tidy do job `lint`
  # le - nao e analise fraca, e ausencia total, e ARCH-PORTS/WIN-DISPLAY
  # ja tem produto de verdade la (src/platform/win32/).
  #
  # Ferramentas desta imagem, MEDIDAS (nao presumidas) contra
  # actions/runner-images/images/windows/Windows2025-Readme.md (a
  # imagem por tras do label windows-latest desde a troca para :latest,
  # confirmado no proprio repositorio: windows-latest = windows-2025)
  # e o script de instalacao images/windows/scripts/build/Install-LLVM.ps1
  # (fetched 03/09/2026):
  #   - LLVM 20.1.8 standalone, instalado via `Install-ChocoPackage llvm`
  #     no caminho x64 (nao o ramo ARM64 do mesmo script) - o pacote
  #     oficial da LLVM traz clang-tidy.exe no mesmo bin/ que clang.exe,
  #     que o proprio Pester de fabrica da imagem (LLVM.Tests.ps1) ja
  #     prova estar no PATH ("clang --version" sem caminho completo).
  #   - Visual Studio 2022 Enterprise 17.14 traz os componentes
  #     VC.Llvm.Clang e VC.Llvm.ClangToolset (integracao clang-cl com o
  #     MSBuild/IDE) - NAO e o que este job usa; o clang-tidy vem do
  #     LLVM standalone acima, que fala com qualquer compile_commands.json,
  #     inclusive um gerado por cl.exe (deteccao automatica de driver
  #     estilo MSVC no clang-tidy, sem flag extra).
  #   - cppcheck e gitleaks NAO constam no inventario desta imagem
  #     (nenhuma ocorrencia em Windows2025-Readme.md nem em
  #     toolset-2025.json) - AUSENCIA DECLARADA, nao escondida: cppcheck
  #     fica de fora do Windows por falta de ferramenta na imagem oficial
  #     (o job `lint` do Fedora continua cobrindo cppcheck, que analisa a
  #     MESMA arvore de codigo-fonte que compila em UNIX - so o ramo
  #     WIN32 fica sem o cppcheck, mesmo downgrade que este projeto ja
  #     declara para o ASan/UBSan no MSVC, ver GlintfxCompileOptions.cmake).
  #     gitleaks nao precisa de job proprio aqui: o job `gitleaks` varre
  #     TEXTO do repositorio (git log -p), nao codigo compilado - ja
  #     cobre todo arquivo, inclusive os de src/platform/win32/, sem
  #     depender de plataforma nenhuma.
  windows-lint:
    name: Windows - Lint (clang-tidy sobre src/platform/win32)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Mesmo passo do job `windows` acima (CI-WIN-ENV/PKG-NATIVE) -
      # CMAKE_EXPORT_COMPILE_COMMANDS precisa de um CMake que atenda o
      # piso 4.1 que este projeto declara, e o clang-tidy le o
      # compile_commands.json que o CMake escreve, nao o compilador em
      # si.
      - name: Instalar CMake >= 4.1 (Windows)
        shell: pwsh
        run: |
          $cmakeVersion = "4.1.6"
          $zipUrl = "https://github.com/Kitware/CMake/releases/download/v$cmakeVersion/cmake-$cmakeVersion-windows-x86_64.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP "glintfx-cmake.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "glintfx-cmake"
          Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractDir
          $cmakeRoot = Get-ChildItem -Path $extractDir -Directory | Select-Object -First 1
          $cmakeBinDir = Join-Path $cmakeRoot.FullName "bin"
          if (-not (Test-Path (Join-Path $cmakeBinDir "cmake.exe"))) {
            Write-Error "cmake.exe not found under $cmakeBinDir after extracting $zipUrl"
            exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value $cmakeBinDir

      - name: Versoes da toolchain
        shell: pwsh
        run: |
          cmake --version
          clang-tidy --version

      # Mesmo passo CI-WIN-ENV do job `windows` acima: sem o ambiente do
      # MSVC preparado, o cl.exe que o CMake vai gravar dentro do
      # compile_commands.json (via -G Ninja) nem se localiza.
      - name: Preparar ambiente do compilador (MSVC x64)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $installPath) {
            Write-Error "Nenhuma instalacao do MSVC com o componente VC.Tools.x86.x64 foi encontrada por vswhere."
            exit 1
          }
          $vcvarsall = Join-Path $installPath "VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvarsall)) {
            Write-Error "vcvarsall.bat nao encontrado em $vcvarsall"
            exit 1
          }
          $envDump = cmd /c "`"$vcvarsall`" x64 && set"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "vcvarsall.bat x64 falhou com codigo $LASTEXITCODE"
            exit 1
          }
          foreach ($line in $envDump) {
            if ($line -match '^([^=]+)=(.*)$') {
              Add-Content -Path $env:GITHUB_ENV -Value "$($matches[1])=$($matches[2])"
            }
          }

      # -DCMAKE_EXPORT_COMPILE_COMMANDS=ON: o unico proposito deste
      # configure e gerar compile_commands.json com o ramo WIN32 real
      # dentro - nunca precisa rodar "cmake --build", clang-tidy analisa
      # a partir da base de compilacao, nao do binario.
      - name: Configurar (gera compile_commands.json)
        shell: pwsh
        run: |
          cmake -S . -B build-lint -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DGLINTFX_WERROR=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # PROVA que o clang-tidy ENXERGA o codigo de Windows (piso de
      # varredura nao-vazia, GODS_LAWS.md L-40) - nao basta o passo
      # seguinte rodar sem erro; se o compile_commands.json nunca
      # tivesse entrado no ramo WIN32, o proximo passo passaria "verde"
      # analisando zero arquivo de plataforma, exatamente a lacuna que
      # esta fatia fecha. Falha aqui, alto e cedo, se as duas TUs do
      # backend Win32 nao aparecerem na base de compilacao.
      - name: Prova - compile_commands.json contem o backend Win32
        shell: pwsh
        run: |
          $db = Get-Content build-lint/compile_commands.json -Raw
          $arquivos = @("display_adapter.cpp", "selected_display_adapter_check.cpp")
          $faltando = $arquivos | Where-Object { $db -notmatch [regex]::Escape($_) }
          if ($faltando.Count -gt 0) {
            Write-Error "compile_commands.json nao contem: $($faltando -join ', ') - o ramo WIN32 de src/platform/CMakeLists.txt nao entrou na base de compilacao, o clang-tidy abaixo analisaria zero arquivo de plataforma."
            exit 1
          }
          Write-Host "ok: compile_commands.json contem as duas TUs do backend Win32."

      # clang-tidy detecta sozinho que o driver de compile_commands.json
      # e cl.exe (modo clang-cl) - nenhum --extra-arg de proposito. .clang-tidy
      # na raiz do repo (mesmo arquivo que o job `lint` do Fedora usa) e
      # descoberto por caminhada de diretorio a partir de cada arquivo,
      # entao a mesma politica de checks vale aqui.
      - name: clang-tidy - src/platform/win32
        shell: pwsh
        run: |
          clang-tidy -p build-lint --quiet src/platform/win32/display_adapter.cpp src/platform/win32/selected_display_adapter_check.cpp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  sanitizer:
    name: Sanitizer (Fedora - ASan/UBSan)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      # libasan/libubsan: pacotes de RUNTIME, separados de gcc-c++ no
      # Fedora. gcc-c++ traz so a copia interna em
      # /usr/lib/gcc/x86_64-redhat-linux/16/ (usada em tempo de
      # compilacao); o SONAME que o linker procura em tempo de link
      # (/usr/lib64/libasan.so.8.0.0, /usr/lib64/libubsan.so.1.0.0) vem
      # dos pacotes libasan/libubsan, que nunca foram instalados aqui -
      # confirmado ao vivo (`dnf provides '*/libasan.so*'`) reproduzindo
      # este job num container fedora:44 isolado, GODS_LAWS.md L-14.
      # Isto e toolchain do ambiente de build, nao dependencia da
      # biblioteca (L-07): nao muda o que glintfx linka em producao.
      - name: Instalar toolchain
        run: >-
          dnf -y install gcc-c++ cmake ninja-build pkgconf-pkg-config git
          wayland-devel wayland-protocols-devel libasan libubsan

      - uses: actions/checkout@v4

      # GODS_LAWS.md L-23 portao 2 ("ASan e UBSan a cada fatia fechada").
      # `ctest -L unit` apenas (dentro de tools/preci.sh): os gates de
      # consumo (LABELS consume, tests/CMakeLists.txt) linkam um
      # consumidor comum contra a lib sanitizada de proposito, o que
      # falha por construcao sob ASan - downgrade declarado, nao um
      # portao mais fraco escondido atras de um nome generico.
      - name: preci.sh --sanitizer-only
        run: |
          set -eux
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tools/preci.sh --sanitizer-only

  # LACUNA 1 (GODS_LAWS.md L-04, medido pelo lider antes desta fatia):
  # o job `sanitizer` acima so roda no Fedora/GNU-Clang - MSVC nunca
  # tinha sido exercitado sob nenhum sanitizer. GlintfxCompileOptions.cmake
  # ja recusava GLINTFX_SANITIZE!="" sob MSVC com FATAL_ERROR
  # incondicional (recusa nomeada, nao silencio) desde a fatia anterior;
  # esta fatia troca aquela recusa incondicional por uma recusa mais
  # estreita, e liga /fsanitize=address de verdade (ver o cabecalho da
  # funcao glintfx_apply_sanitizer_flags para as fontes).
  #
  # AUSENCIA DECLARADA, nao escondida: MSVC so tem AddressSanitizer
  # (deteccao de memoria). NAO existe, em NENHUMA versao do MSVC, o
  # equivalente ao UBSan (deteccao de comportamento indefinido) que o
  # job `sanitizer` acima liga no GCC/Clang com
  # -DGLINTFX_SANITIZE=address,undefined - por isso este job configura
  # so com -DGLINTFX_SANITIZE=address, metade do que o par Linux cobre,
  # e essa metade que falta NUNCA vai poder ser fechada aqui: e limite
  # do compilador, nao pendencia deste projeto (learn.microsoft.com/cpp/
  # sanitizers/asan, secao "Overview" - o inventario de sanitizers da
  # Microsoft para C++ e so ASan).
  #
  # Mesmo downgrade declarado que o job `sanitizer` acima ja assume:
  # so o rotulo `unit` (ctest -L '^unit$'), nunca a suite inteira - os
  # gates de consumo (LABELS consume) linkam um consumidor comum contra
  # a lib sanitizada de proposito, e isso falha por construcao sob ASan
  # em QUALQUER compilador (o runtime do sanitizer tem que vir primeiro
  # no processo), nao so no GCC/Clang.
  windows-sanitizer:
    name: Windows - Sanitizer (ASan)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Mesmo passo do job `windows` acima (CI-WIN-ENV/PKG-NATIVE).
      - name: Instalar CMake >= 4.1 (Windows)
        shell: pwsh
        run: |
          $cmakeVersion = "4.1.6"
          $zipUrl = "https://github.com/Kitware/CMake/releases/download/v$cmakeVersion/cmake-$cmakeVersion-windows-x86_64.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP "glintfx-cmake.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "glintfx-cmake"
          Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractDir
          $cmakeRoot = Get-ChildItem -Path $extractDir -Directory | Select-Object -First 1
          $cmakeBinDir = Join-Path $cmakeRoot.FullName "bin"
          if (-not (Test-Path (Join-Path $cmakeBinDir "cmake.exe"))) {
            Write-Error "cmake.exe not found under $cmakeBinDir after extracting $zipUrl"
            exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value $cmakeBinDir

      - name: Versoes da toolchain
        shell: pwsh
        run: cmake --version

      # Mesmo passo CI-WIN-ENV do job `windows` acima.
      - name: Preparar ambiente do compilador (MSVC x64)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $installPath) {
            Write-Error "Nenhuma instalacao do MSVC com o componente VC.Tools.x86.x64 foi encontrada por vswhere."
            exit 1
          }
          $vcvarsall = Join-Path $installPath "VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvarsall)) {
            Write-Error "vcvarsall.bat nao encontrado em $vcvarsall"
            exit 1
          }
          $envDump = cmd /c "`"$vcvarsall`" x64 && set"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "vcvarsall.bat x64 falhou com codigo $LASTEXITCODE"
            exit 1
          }
          foreach ($line in $envDump) {
            if ($line -match '^([^=]+)=(.*)$') {
              Add-Content -Path $env:GITHUB_ENV -Value "$($matches[1])=$($matches[2])"
            }
          }

      # -DGLINTFX_SANITIZE=address: o par Windows de
      # -DGLINTFX_SANITIZE=address,undefined do job `sanitizer` (Fedora)
      # acima - so o compartilhado (BUILD_SHARED_LIBS default ON), mesmo
      # escopo que o job irmao cobre (nenhum dos dois testa o modo
      # estatico sob sanitizer).
      - name: Configurar e compilar (Release, ASan)
        shell: pwsh
        run: |
          cmake -S . -B build-shared -G Ninja -DCMAKE_BUILD_TYPE=Release -DGLINTFX_WERROR=ON -DGLINTFX_SANITIZE=address
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-shared
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Piso de varredura nao-vazia (GODS_LAWS.md L-40) antes de rodar:
      # ctest -N conta quantos casos o rotulo `unit` casa ANTES de
      # confiar no passo seguinte - mesmo padrao que "Saida verbosa da
      # sonda de runner" (job `windows` acima) ja usa para o mesmo
      # motivo (zero aqui so pode significar rotulo quebrado ou build
      # sem teste, nunca "arvore limpa").
      - name: Prova - rotulo 'unit' nao esta vazio
        shell: pwsh
        run: |
          $listOutput = ctest --test-dir build-shared -L '^unit$' -N
          $totalLine = $listOutput | Select-String -Pattern 'Total Tests:\s*(\d+)'
          $total = if ($totalLine) { [int]$totalLine.Matches[0].Groups[1].Value } else { 0 }
          if ($total -eq 0) {
            Write-Error "esperado ao menos 1 teste rotulado 'unit' neste build - ctest -N contou 0 (rotulo quebrado ou build sem teste)."
            exit 1
          }
          Write-Host "ok: $total teste(s) rotulado(s) 'unit'."

      - name: Testes (ASan, rotulo unit)
        shell: pwsh
        run: |
          ctest --test-dir build-shared -L '^unit$' --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  debug:
    name: Debug (Fedora - assert() de produto ligado, GATE-DEBUG)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      # Mesmo toolchain do job `lint` acima (nenhum runtime de
      # sanitizer aqui - GATE-DEBUG e sobre NDEBUG/assert(), nao sobre
      # ASan/UBSan, que ja tem o proprio job dedicado).
      #
      # python3 (DEPZERO-TRACE, achado do bloqueador de 29/08/2026):
      # ESTE job, ao contrario de `lint`/`sanitizer`/`clang` acima, roda
      # a suite ctest INTEIRA (preci.sh --debug-only -> stage_debug,
      # sem filtro `-L unit`) - e dep_zero_trace/dep_zero_trace_selftest
      # estao nela. `lint` nunca chama ctest; `sanitizer`/`clang` filtram
      # por `-L unit`, rotulo que os dois testes deste dep-zero-trace
      # NAO tem (LABELS consume/selftest) - por isso so este job dentre
      # os quatro "Fedora extra" precisou da linha nova. Mesma medicao
      # de pacote do bloco Fedora do job `linux` acima (dnf, "python3").
      - name: Instalar toolchain
        run: >-
          dnf -y install gcc-c++ cmake ninja-build pkgconf-pkg-config git
          wayland-devel wayland-protocols-devel python3

      - uses: actions/checkout@v4

      # GODS_LAWS.md L-40 / TODO.md GATE-DEBUG / DECISOES_AUTONOMAS.md
      # D4: -DCMAKE_BUILD_TYPE=Release (todo OUTRO job desta matriz)
      # define NDEBUG, o que apaga todo assert() de produto - nenhum
      # portao desta casa jamais compilou uma arvore onde NDEBUG esta
      # indefinido, entao nenhuma precondicao de produto jamais foi
      # exercitada como codigo compilado. `preci.sh --debug-only` conta
      # os assert() de produto na arvore (reprova em zero, L-40),
      # configura -DCMAKE_BUILD_TYPE=Debug (que NAO define NDEBUG - a
      # propria convencao padrao do CMake, nao invencao deste projeto)
      # e roda a suite ctest inteira contra esse build - a suite
      # inteira, nao so o rotulo `unit` (ao contrario do job
      # `sanitizer`): um build Debug simples nao tem a restricao de
      # interposicao de runtime que obriga o downgrade do ASan, entao
      # os gates de consumo (LABELS consume) rodam aqui como em
      # qualquer outro build nao-sanitizado.
      - name: preci.sh --debug-only
        run: |
          set -eux
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tools/preci.sh --debug-only

  # Item DEBUG-PARITY-WIN (TODO.md, GODS_LAWS.md L-04/L-40): o par
  # Windows do job `debug` acima. Ate esta fatia, nenhum assert() de
  # produto deste projeto jamais rodou compilado pelo MSVC - o job
  # `windows-sanitizer` compila Release sob ASan (NDEBUG definido) e a
  # matriz `windows` principal tambem so compila Release, entao NENHUM
  # job Windows desta arvore jamais desligou NDEBUG antes deste.
  #
  # tools/preci.sh nao roda neste runner (e um script bash). Este job
  # replica `stage_debug`/`count_product_asserts` de tools/preci.sh
  # (mesmos dois globs de arquivo, mesma exclusao de tests/ e
  # third_party/, mesma regra "assert( no inicio de palavra, linha que
  # comeca com // depois de so espaco em branco nao conta, static_
  # assert NUNCA casa porque o caractere logo antes de assert( ali e
  # '_'") em PowerShell inline, mesmo padrao que `windows-lint` e
  # `windows-sanitizer` acima ja usam (nenhum dos dois chama tools/
  # preci.ps1 tampouco) - tools/preci.ps1 nao ganhou modo -DebugOnly
  # nesta fatia, fora do escopo de arquivo desta task.
  #
  # CONTAGEM MEDIDA NESTA ARVORE, NAO COPIADA (mesmo alerta que o job
  # `debug` acima ja deixou registrado: "a contagem tinha apodrecido -
  # era 9, nao 5"): rodando a MESMA regra em bash contra a arvore deste
  # commit, o total e 9 assert() de produto em 6 arquivos
  # (include/glintfx/core/err.hpp:4; um cada em src/gfss/color_parse.cpp,
  # src/gfss/named_colors.cpp, src/gfss/numeric_lexeme.cpp,
  # src/gfss/tokenizer.cpp, tools/gl_registry_codegen/registry_parser.cpp).
  # O passo abaixo NAO imprime esse numero fixo - ele conta de novo, ao
  # vivo, contra o que o job realmente fez checkout (GODS_LAWS.md L-40:
  # numero escrito aqui apodrece, o comando que mede nao).
  windows-debug:
    name: Windows - Debug (assert() de produto ligado, GATE-DEBUG)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Mesmo passo do job `windows`/`windows-sanitizer` acima (CI-WIN-ENV/PKG-NATIVE).
      - name: Instalar CMake >= 4.1 (Windows)
        shell: pwsh
        run: |
          $cmakeVersion = "4.1.6"
          $zipUrl = "https://github.com/Kitware/CMake/releases/download/v$cmakeVersion/cmake-$cmakeVersion-windows-x86_64.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP "glintfx-cmake.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "glintfx-cmake"
          Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractDir
          $cmakeRoot = Get-ChildItem -Path $extractDir -Directory | Select-Object -First 1
          $cmakeBinDir = Join-Path $cmakeRoot.FullName "bin"
          if (-not (Test-Path (Join-Path $cmakeBinDir "cmake.exe"))) {
            Write-Error "cmake.exe not found under $cmakeBinDir after extracting $zipUrl"
            exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value $cmakeBinDir

      - name: Versoes da toolchain
        shell: pwsh
        run: cmake --version

      # Mesmo passo CI-WIN-ENV do job `windows` acima.
      - name: Preparar ambiente do compilador (MSVC x64)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $installPath) {
            Write-Error "Nenhuma instalacao do MSVC com o componente VC.Tools.x86.x64 foi encontrada por vswhere."
            exit 1
          }
          $vcvarsall = Join-Path $installPath "VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvarsall)) {
            Write-Error "vcvarsall.bat nao encontrado em $vcvarsall"
            exit 1
          }
          $envDump = cmd /c "`"$vcvarsall`" x64 && set"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "vcvarsall.bat x64 falhou com codigo $LASTEXITCODE"
            exit 1
          }
          foreach ($line in $envDump) {
            if ($line -match '^([^=]+)=(.*)$') {
              Add-Content -Path $env:GITHUB_ENV -Value "$($matches[1])=$($matches[2])"
            }
          }

      # Piso de varredura nao-vazia (GODS_LAWS.md L-40), mesma regra de
      # count_real_asserts_in_file/count_product_asserts de tools/
      # preci.sh (ver o cabecalho deste job): '(^|[^\w])assert\(' casa
      # uma chamada assert( no inicio da linha ou depois de um
      # caractere que nao e letra/digito/underscore - static_assert(
      # NUNCA casa, porque o caractere logo antes de "assert(" ali e
      # '_', que a classe [^\w] proibe; uma linha comentada e a que
      # comeca com // depois so de espaco em branco, mesma definicao de
      # preci.sh.
      - name: Contar assert() de produto (GATE-DEBUG)
        shell: pwsh
        run: |
          $files = @(git ls-files -- '*.cpp' '*.hpp' ':!:tests/*' ':!:third_party/*')
          if ($LASTEXITCODE -ne 0) {
            Write-Error "git ls-files falhou - varredura recusada, nunca presumida vazia (GODS_LAWS.md L-40)"
            exit 1
          }
          $total = 0
          foreach ($f in $files) {
            if ([string]::IsNullOrWhiteSpace($f)) { continue }
            $lines = Get-Content -LiteralPath $f
            $n = 0
            foreach ($line in $lines) {
              if ($line -notmatch '(^|[^\w])assert\(') { continue }
              if ($line -match '^\s*//') { continue }
              $n++
            }
            if ($n -gt 0) {
              Write-Host "  $f : $n"
            }
            $total += $n
          }
          if ($total -eq 0) {
            Write-Error "estagio debug recusado (varredura vazia de assert() de produto - GODS_LAWS.md L-40, GATE-DEBUG)"
            exit 1
          }
          Write-Host "ok: $total assert() de produto encontrado(s) na arvore."

      # -DCMAKE_BUILD_TYPE=Debug: mesma razao do job `debug` acima -
      # CMake so define NDEBUG em Release/RelWithDebInfo/MinSizeRel,
      # nunca em Debug, entao este e o UNICO job Windows onde assert()
      # de produto compila para um teste de verdade em vez de sumir.
      # Suite INTEIRA (sem -L unit), mesma razao do job `debug`: um
      # build Debug simples nao tem a restricao de interposicao de
      # runtime que obriga o downgrade do ASan.
      - name: Configurar e compilar (Debug)
        shell: pwsh
        run: |
          cmake -S . -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DGLINTFX_WERROR=ON -DGLINTFX_BUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Piso de varredura nao-vazia (GODS_LAWS.md L-40) antes de rodar -
      # mesmo padrao que o job `windows-sanitizer` acima ja usa.
      - name: Prova - suite nao esta vazia
        shell: pwsh
        run: |
          $listOutput = ctest --test-dir build-debug -N
          $totalLine = $listOutput | Select-String -Pattern 'Total Tests:\s*(\d+)'
          $total = if ($totalLine) { [int]$totalLine.Matches[0].Groups[1].Value } else { 0 }
          if ($total -eq 0) {
            Write-Error "esperado ao menos 1 teste no build Debug - ctest -N contou 0."
            exit 1
          }
          Write-Host "ok: $total teste(s) no build Debug."

      - name: Testes (Debug, suite inteira)
        shell: pwsh
        run: |
          ctest --test-dir build-debug --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Item CLANG-JOB da onda W2 (25/08/2026): honra a promessa de robustez
  # entre compiladores diferentes da GODS_LAWS.md L-22 (o motivo dela e
  # ABI: excecao atravessando .so exige RTTI compativel entre
  # compiladores) - ate aqui o CI so compilava com GCC (`linux`) e MSVC
  # (`windows`), nunca Clang. Fedora apenas (mesmo raciocinio dos
  # jobs `lint`/`sanitizer` acima, que tambem so rodam la): achado de
  # COMPILADOR nao e especifico de distro, e um segundo eixo (Fedora x
  # Ubuntu x Arch x CachyOS) so multiplicaria o tempo de CI sem provar
  # nada novo. Duas entradas de matriz (compartilhado/estatico), mesma
  # forma CI-CONSUME dos jobs `linux`/`windows` acima - independentes,
  # nao passos sequenciais. -DGLINTFX_WERROR=ON: cmake/GlintfxCompileOptions.cmake
  # ja trata Clang igual a GNU para -Wall/-Wextra/-Wpedantic/-Werror, sem
  # ramo por-compilador a manter aqui - medido em container fedora:44
  # antes deste job existir: os DOIS modos compilam limpos, zero aviso.
  clang:
    name: Clang (Fedora - segundo compilador, ${{ matrix.modo }})
    runs-on: ubuntu-latest
    container: fedora:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - modo: compartilhado
            builddir: build-shared
            shared_flag: ""
          - modo: estatico
            builddir: build-static
            shared_flag: "-DBUILD_SHARED_LIBS=OFF"
    steps:
      - name: Instalar toolchain
        run: >-
          dnf -y install clang cmake ninja-build pkgconf-pkg-config git
          wayland-devel wayland-protocols-devel

      - uses: actions/checkout@v4

      - name: Versao do Clang
        run: clang++ --version

      - name: Build (${{ matrix.modo }})
        run: |
          set -eux
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -S . -B ${{ matrix.builddir }} -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ ${{ matrix.shared_flag }} -DGLINTFX_WERROR=ON
          cmake --build ${{ matrix.builddir }}

      # DOWNGRADE DECLARADO, mesmo padrao do job `sanitizer` acima (nao
      # um portao mais fraco escondido atras de nome generico): so
      # `ctest -L unit`, nao a suite inteira. Achado REAL, medido em
      # container fedora:44 (nao suposto, nunca corrigido aqui - fora de
      # escopo desta fatia, GODS_LAWS.md L-12: quem escreve o job de CI
      # nao conserta codigo de produto ou teste no mesmo commit): dois
      # gates de CONSUMO (install_packager_layout_test, pkgconfig_test -
      # LABELS consume, tests/CMakeLists.txt) reprovam sob Clang neste
      # alvo, e o GCC do MESMO container passa nos dois. Causa raiz
      # confirmada por medicao direta (nao suposicao): (1)
      # install_packager_layout_test - CMake auto-detecta
      # CMAKE_LIBRARY_ARCHITECTURE=x86_64-redhat-linux-gnu para o Clang
      # do Fedora (o GCC do MESMO Fedora nao reporta arquitetura
      # nenhuma - e por isso que o "hinted scenario" do teste sempre
      # bastava ate aqui), e esse valor auto-detectado sobrepoe o hint
      # explicito (`-DCMAKE_LIBRARY_ARCHITECTURE=x86_64-linux-gnu`) que
      # check_install_packager_layout.sh passa para o consumidor -
      # find_package procura em lib/x86_64-redhat-linux-gnu/cps/ em vez
      # de lib/x86_64-linux-gnu/cmake/, onde o pacote foi instalado. (2)
      # pkgconfig_test - o controle negativo de Libs.private
      # (assert_probe_links_without_wayland_client_fails,
      # tests/tools/check_pkgconfig.sh) linka a sonda SEM
      # -lwayland-client e espera falha por simbolo indefinido; sob GCC
      # falha como esperado, sob Clang o link "sucede" sem nenhum
      # simbolo wl_* no binario final (confirmado por readelf/nm: o
      # membro do arquivo estatico que contem xdg_wm_base_interface
      # nunca chega a ser extraido do .a) - o proprio premissa da sonda
      # ("referenciar este simbolo forca a extracao") nao se sustenta
      # sob este compilador. Nenhum dos dois e defeito de PRODUTO
      # (nenhuma linha de src/ ou include/ envolvida) - sao suposicoes
      # de infraestrutura de teste que valiam sob GCC e nao sob Clang.
      # Achados reportados na tabela de pendencias, nao consertados
      # aqui - ver TODO.md, item CLANG-JOB.
      - name: ctest -L unit (${{ matrix.modo }})
        run: |
          set -eux
          ctest --test-dir ${{ matrix.builddir }} -L '^unit$' --output-on-failure

  gitleaks:
    name: Gitleaks (scan de segredo)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: `gitleaks detect` (sem flags) varre o git log
      # inteiro por padrao (verificado ao vivo nesta versao, 8.30.0 - ver
      # .gitleaksignore); o checkout raso default (profundidade 1) so
      # exporia o ultimo commit ao scanner, dando falsa sensacao de
      # cobertura completa.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        run: sudo apt-get update && sudo apt-get install -y gitleaks

      # GODS_LAWS.md L-23 portao 4. .gitleaksignore na raiz supre os dois
      # falsos positivos conhecidos (a chave de exemplo de CONTRACT.md
      # 7.1, documentacao do que NAO fazer) por fingerprint de commit -
      # nenhum termo generico e ignorado.
      - name: gitleaks detect
        run: gitleaks detect --no-banner --source .

  leis:
    name: Gate das leis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GODS_LAWS.md L-05 (Wayland puro) e L-06 (parser de keymap
      # proprio) NAO estao mais aqui. Item GATE-TREE-PARITY (GODS_LAWS.md
      # L-04, decisao do lider: "O comportamento deve ser igual em
      # qualquer OS" - a versao anterior, um passo sh direto neste job
      # ubuntu-only, nunca tocava Windows/CachyOS/Arch separadamente,
      # mesmo sendo uma varredura de texto puro sem mecanismo especifico
      # de Unix por tras): a logica virou tests/tools/check_no_x11.py,
      # registrada como ctest (x11_test/x11_selftest, tests/CMakeLists.txt)
      # SEM guarda de sistema - ela ja roda dentro de `ctest --test-dir
      # ...` nos jobs `linux` e `windows` acima, nas cinco plataformas.
      # O antigo tests/tools/check_no_x11.sh foi apagado no mesmo passo.

      # GODS_LAWS.md L-08 (publico no GitHub, AGPL-3.0) e L-40 (piso de
      # varredura nao-vazia) NAO estao mais aqui. Item SPDX-GATE-PY
      # (GODS_LAWS.md L-04, decisao do lider de 02/09/2026: "O
      # comportamento deve ser igual em qualquer OS"): a logica virou
      # tests/tools/check_spdx.py, registrada como ctest (spdx_test/
      # spdx_selftest, tests/CMakeLists.txt) SEM guarda de sistema -
      # ela ja roda dentro de `ctest --test-dir ...` nos jobs `linux` e
      # `windows` acima, nas cinco plataformas, em vez de so aqui, num
      # unico job ubuntu-only que nunca tocava Windows/CachyOS/Arch
      # separadamente. O antigo tests/tools/check_spdx.sh foi apagado
      # no mesmo passo.

      # GODS_LAWS.md L-07 EXCECAO No 1 (third_party/khronos/ e a UNICA
      # excecao de glintfx a lei de dependencia zero) e L-40 (piso de
      # varredura nao-vazia) NAO estao mais aqui. Item GATE-TREE-PARITY
      # (GODS_LAWS.md L-04, decisao do lider: "O comportamento deve ser
      # igual em qualquer OS"): a logica virou tests/tools/
      # check_vendor_purity.py, registrada como ctest (vendor_purity_test/
      # vendor_purity_selftest, tests/CMakeLists.txt) SEM guarda de
      # sistema - ela ja roda dentro de `ctest --test-dir ...` nos jobs
      # `linux` e `windows` acima, nas cinco plataformas, em vez de so
      # aqui, num unico job ubuntu-only que nunca tocava Windows/
      # CachyOS/Arch separadamente. Os antigos tests/tools/
      # check_vendor_purity.sh e tests/tools/khronos_vendor_files.sh
      # (a biblioteca fonte da enumeracao fechada, sem mais nenhum
      # consumidor) foram apagados no mesmo passo - check_spdx.py ja
      # duplicava a mesma enumeracao de tres arquivos como constante
      # Python propria (SPDX-GATE-PY, 02/09/2026).

      # GODS_LAWS.md / ESCOPO.md separacao LEI/ESCOPO (26/08/2026) e
      # docs/api-conventions.md R6 NAO estao mais aqui. Item
      # GATE-TREE-PARITY (GODS_LAWS.md L-04): a logica de check_dup_laws.sh
      # virou tests/tools/check_dup_laws.py (ctest dup_laws_test/
      # dup_laws_selftest, SEM guarda de sistema, cinco plataformas); a
      # de check_public_name_collision.sh virou tests/tools/
      # check_public_name_collision.py (ctest public_name_collision_test/
      # public_name_collision_selftest, guarda restrita a
      # CMAKE_CXX_COMPILER_ID != MSVC - GCC-frontend-only por natureza da
      # tecnica de descoberta, ausencia declarada por message(STATUS ...)
      # no MSVC, nao guarda silenciosa - ver o script's own header).
      # Nenhum dos dois script nunca teve passo direto neste job "leis"
      # (ja eram so ctest, if(UNIX)-guardado); os antigos tests/tools/
      # check_dup_laws.sh e check_public_name_collision.sh foram
      # apagados no mesmo passo, junto com o resto de GATE-TREE-PARITY.
