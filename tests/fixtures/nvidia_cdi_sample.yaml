# SPDX-License-Identifier: AGPL-3.0-or-later
#
# nvidia_cdi_sample.yaml - QA-COMPOSED-PHOTOS G4a: a hand-written, minimal CDI specification in the text shape that
# `nvidia-ctk cdi generate` writes (cdiVersion 0.7.0), read only by tests/tools/nvidia_cdi_mounts.py --selftest.
# It is not a copy of any machine's specification. The driver version 999.1.2 is fake on purpose: a mount list
# frozen on a real version fails here. The deviceNodes blocks carry card0 and nvidia-uvm, and the mounts carry
# libraries and files outside the allowed list (one with a containerPath of its own), so the selftest proves the
# tool reads neither.
---
cdiVersion: 0.7.0
kind: nvidia.com/gpu
devices:
    - name: "0"
      containerEdits:
        deviceNodes:
            - path: /dev/nvidia0
            - path: /dev/dri/card0
            - path: /dev/dri/renderD129
containerEdits:
    deviceNodes:
        - path: /dev/nvidia-modeset
        - path: /dev/nvidia-uvm
        - path: /dev/nvidiactl
    hooks:
        - hookName: createContainer
          path: /usr/bin/nvidia-cdi-hook
          args:
            - nvidia-cdi-hook
            - create-symlinks
            - --link
            - ../libnvidia-allocator.so.1::/usr/lib64/gbm/nvidia-drm_gbm.so
        - hookName: createContainer
          path: /usr/bin/nvidia-cdi-hook
          args:
            - nvidia-cdi-hook
            - create-symlinks
            - --link
            - libEGL_nvidia.so.999.1.2::/usr/lib64/libEGL_nvidia.so.0
            - --link
            - libGLESv2_nvidia.so.999.1.2::/usr/lib64/libGLESv2_nvidia.so.2
            - --link
            - libGLX_nvidia.so.999.1.2::/usr/lib64/libGLX_nvidia.so.0
            - --link
            - libcuda.so.999.1.2::/usr/lib64/libcuda.so.1
            - --link
            - libnvidia-allocator.so.999.1.2::/usr/lib64/libnvidia-allocator.so.1
        - hookName: createContainer
          path: /usr/bin/nvidia-cdi-hook
          args:
            - nvidia-cdi-hook
            - enable-cuda-compat
            - --host-driver-version=999.1.2
    mounts:
        - hostPath: /usr/bin/nvidia-smi
          containerPath: /usr/bin/nvidia-smi
          options:
            - ro
        - hostPath: /usr/lib64/libEGL_nvidia.so.999.1.2
          containerPath: /usr/lib64/libEGL_nvidia.so.999.1.2
          options:
            - ro
        - hostPath: /usr/lib64/libGLESv2_nvidia.so.999.1.2
          containerPath: /usr/lib64/libGLESv2_nvidia.so.999.1.2
          options:
            - ro
        - hostPath: /usr/lib64/libGLX_nvidia.so.999.1.2
          containerPath: /usr/lib64/libGLX_nvidia.so.999.1.2
          options:
            - ro
        - hostPath: /usr/lib64/libcuda.so.999.1.2
          containerPath: /usr/lib64/libcuda.so.999.1.2
          options:
            - ro
        - hostPath: /usr/lib64/libnvidia-allocator.so.999.1.2
          containerPath: /usr/lib64/libnvidia-allocator.so.999.1.2
          options:
            - ro
        - hostPath: /usr/lib64/libnvidia-egl-gbm.so.1.1.4
          containerPath: /usr/lib64/libnvidia-egl-gbm.so.1.1.4
          options:
            - ro
        - hostPath: /usr/lib64/libnvidia-egl-wayland.so.1.1.24
          containerPath: /usr/lib64/libnvidia-egl-wayland.so.1.1.24
          options:
            - ro
        - hostPath: /usr/lib64/libnvidia-egl-wayland2.so.1.0.2
          containerPath: /usr/lib64/libnvidia-egl-wayland2.so.1.0.2
          options:
            - ro
        - hostPath: /usr/lib64/libnvidia-egl-xcb.so.1.0.6
          containerPath: /usr/lib64/libnvidia-egl-xcb.so.1.0.6
          options:
            - ro
        - hostPath: /usr/lib64/libnvidia-eglcore.so.999.1.2
          containerPath: /usr/lib64/libnvidia-eglcore.so.999.1.2
          options:
            - ro
        - hostPath: /usr/lib64/libnvidia-glcore.so.999.1.2
          containerPath: /usr/lib64/libnvidia-glcore.so.999.1.2
          options:
            - ro
        - hostPath: /usr/lib64/libnvidia-glsi.so.999.1.2
          containerPath: /usr/lib64/libnvidia-glsi.so.999.1.2
          options:
            - ro
        - hostPath: /usr/lib64/libnvidia-gpucomp.so.999.1.2
          containerPath: /usr/lib64/libnvidia-gpucomp.so.999.1.2
          options:
            - ro
        - hostPath: /usr/lib64/libnvidia-tls.so.999.1.2
          containerPath: /usr/lib64/libnvidia-tls.so.999.1.2
          options:
            - ro
        - hostPath: /usr/lib64/libnvidia-wayland-client.so.999.1.2
          containerPath: /usr/lib64/libnvidia-wayland-client.so.999.1.2
          options:
            - ro
        - hostPath: /lib/firmware/nvidia/999.1.2/gsp_ga10x.bin
          containerPath: /lib/firmware/nvidia/999.1.2/gsp_ga10x.bin
          options:
            - ro
        - hostPath: /usr/share/egl/egl_external_platform.d/09_nvidia_wayland2.json
          containerPath: /usr/share/egl/egl_external_platform.d/09_nvidia_wayland2.json
          options:
            - ro
        - hostPath: /usr/share/egl/egl_external_platform.d/10_nvidia_wayland.json
          containerPath: /usr/share/egl/egl_external_platform.d/10_nvidia_wayland.json
          options:
            - ro
        - hostPath: /usr/share/egl/egl_external_platform.d/15_nvidia_gbm.json
          containerPath: /usr/share/egl/egl_external_platform.d/15_nvidia_gbm.json
          options:
            - ro
        - hostPath: /usr/share/egl/egl_external_platform.d/20_nvidia_xcb.json
          containerPath: /usr/share/egl/egl_external_platform.d/20_nvidia_xcb.json
          options:
            - ro
        - hostPath: /usr/share/vulkan/icd.d/nvidia_icd.x86_64.json
          containerPath: /etc/vulkan/icd.d/nvidia_icd.x86_64.json
          options:
            - ro
        - hostPath: /usr/share/glvnd/egl_vendor.d/10_nvidia.json
          containerPath: /usr/share/glvnd/egl_vendor.d/10_nvidia.json
          options:
            - ro
