# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

# Cinco alvos distintos, por ordem do lider (GODS_LAWS.md, L-04):
# Fedora, Ubuntu, CachyOS, Arch e Windows.
# Fedora 44 e o ALVO PRIMARIO: e o sistema que o lider usa. Fica pinado
# na versao dele, nao em :latest, para o CI falhar quando a maquina dele
# falharia. Os demais alvos sao de portabilidade.
# CachyOS NAO e coberto pelo job de Arch: imagem propria, repositorios
# proprios, toolchain propria. Verde no Arch nao autoriza declarar
# CachyOS suportado.
#
# GODS_LAWS.md L-23, os quatro portoes, FUND-4: portao 1 (-Werror) esta
# em TODO build abaixo (linux e windows, via -DGLINTFX_WERROR=ON / /WX);
# portao 2 (ASan/UBSan) e o job `sanitizer`; portao 3 (analise estatica)
# e o job `lint`; portao 4 (scan de segredo) e o job `gitleaks`. Os tres
# jobs novos rodam so no Fedora 44 pinado (alvo primario, L-04) - nao
# nos quatro alvos Linux da matriz - porque nenhum deles prova algo
# especifico de distro: clang-tidy/cppcheck/gitleaks analisam a mesma
# arvore de codigo-fonte em qualquer lugar, e ASan/UBSan e comportamento
# de runtime do compilador, ja coberto pelo GCC do alvo primario. `lint`
# e `sanitizer` chamam tools/preci.sh --lint-only/--sanitizer-only, a
# mesma logica de estagio que um desenvolvedor roda localmente (TESTES.md
# T15.2) - nao ha segunda copia da logica de estagio vivendo so aqui.
#
# CI-CONSUME (decisao do lider, relatada pelo coordenador): compartilhado
# e estatico agora sao ENTRADAS INDEPENDENTES da matriz, em `linux` e em
# `windows`, por simetria - antes eram dois PASSOS sequenciais dentro da
# mesma entrada de matriz, e uma falha no compartilhado abortava o job
# inteiro, pulando o estatico sem rodar (aconteceu duas vezes na mesma
# tarde: CI-CONSUME e CI-CONSUME-2). `fail-fast: false`, ja presente no
# `linux`, so garante independencia ENTRE entradas de matriz - nunca
# ajudou aqui, porque compartilhado/estatico eram passos, nao entradas.
#
# CONTAGEM DE CELULAS, pedida explicitamente pelo lider - "cinco alvos x
# dois modos continua sendo dez": ANTES, `linux` tinha 4 entradas de
# matriz (Fedora, Ubuntu, Arch, CachyOS), cada uma rodando os dois modos
# como passos sequenciais = 4 job-runs cobrindo 8 celulas; `windows` era
# 1 job sem matriz, tambem dois modos como passos sequenciais = 1
# job-run cobrindo 2 celulas. Total: 5 job-runs, 10 celulas, mas so 5
# delas independentes de verdade (uma falha em qualquer passo
# compartilhado escondia o resultado do estatico irmao). DEPOIS: `linux`
# tem 8 entradas de matriz (4 alvos x 2 modos) e `windows` tem 2 (1 alvo
# x 2 modos) = 10 job-runs, 10 celulas, TODAS independentes - nenhuma
# celula da matriz se perdeu no caminho.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: ${{ matrix.nome }}
    runs-on: ubuntu-latest
    container: ${{ matrix.imagem }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # O g++ padrao do 24.04 e o 13.3, que da C++23 parcial
          # (__cplusplus=202100, sem <print>). Piso de toolchain do projeto
          # e GCC 14, medido em 21/08/2026: 14.2 devolve 202302.
          #
          # Oito entradas (4 alvos x 2 modos), nao quatro - CI-CONSUME:
          # compartilhado e estatico sao entradas DISTINTAS da matriz, nao
          # dois passos dentro da mesma entrada, para que uma falha no
          # compartilhado de um alvo nunca esconda o resultado do
          # estatico irmao (nem o de nenhum outro alvo - fail-fast: false
          # ja cobria isso entre alvos; agora cobre entre modos tambem).
          - nome: Fedora 44 (primario) - compartilhado
            cc: c++
            imagem: fedora:44
            instalar: >-
              dnf -y install gcc-c++ cmake ninja-build pkgconf-pkg-config git
              wayland-devel wayland-protocols-devel
            modo: compartilhado
            builddir: build-shared
            shared_flag: ""
          - nome: Fedora 44 (primario) - estatico
            cc: c++
            imagem: fedora:44
            instalar: >-
              dnf -y install gcc-c++ cmake ninja-build pkgconf-pkg-config git
              wayland-devel wayland-protocols-devel
            modo: estatico
            builddir: build-static
            shared_flag: "-DBUILD_SHARED_LIBS=OFF"
          - nome: Ubuntu - compartilhado
            cc: g++-14
            imagem: ubuntu:24.04
            instalar: >-
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y
              g++-14 cmake ninja-build pkg-config git ca-certificates
              libwayland-dev libwayland-bin wayland-protocols
            modo: compartilhado
            builddir: build-shared
            shared_flag: ""
          - nome: Ubuntu - estatico
            cc: g++-14
            imagem: ubuntu:24.04
            instalar: >-
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y
              g++-14 cmake ninja-build pkg-config git ca-certificates
              libwayland-dev libwayland-bin wayland-protocols
            modo: estatico
            builddir: build-static
            shared_flag: "-DBUILD_SHARED_LIBS=OFF"
          - nome: Arch - compartilhado
            cc: c++
            imagem: archlinux:latest
            instalar: >-
              pacman -Syu --noconfirm gcc cmake ninja pkgconf git
              wayland wayland-protocols
            modo: compartilhado
            builddir: build-shared
            shared_flag: ""
          - nome: Arch - estatico
            cc: c++
            imagem: archlinux:latest
            instalar: >-
              pacman -Syu --noconfirm gcc cmake ninja pkgconf git
              wayland wayland-protocols
            modo: estatico
            builddir: build-static
            shared_flag: "-DBUILD_SHARED_LIBS=OFF"
          - nome: CachyOS - compartilhado
            cc: c++
            imagem: cachyos/cachyos:latest
            instalar: >-
              pacman -Syu --noconfirm gcc cmake ninja pkgconf git
              wayland wayland-protocols
            modo: compartilhado
            builddir: build-shared
            shared_flag: ""
          - nome: CachyOS - estatico
            cc: c++
            imagem: cachyos/cachyos:latest
            instalar: >-
              pacman -Syu --noconfirm gcc cmake ninja pkgconf git
              wayland wayland-protocols
            modo: estatico
            builddir: build-static
            shared_flag: "-DBUILD_SHARED_LIBS=OFF"
    steps:
      - name: Instalar toolchain
        run: ${{ matrix.instalar }}

      - uses: actions/checkout@v4

      - name: Versoes da toolchain
        run: |
          set -eux
          ${{ matrix.cc }} --version
          cmake --version
          ninja --version
          pkg-config --modversion wayland-client
          pkg-config --modversion wayland-protocols
          wayland-scanner --version

      # L-05: Linux e Wayland puro. Sem xdg-shell.xml nao se abre janela,
      # entao a ausencia dele e falha de ambiente, nao detalhe.
      - name: Protocolos Wayland presentes
        run: |
          set -eu
          xml="$(pkg-config --variable=pkgdatadir wayland-protocols)/stable/xdg-shell/xdg-shell.xml"
          test -f "$xml" || { echo "FALTA xdg-shell.xml em $xml"; exit 1; }
          echo "ok: $xml"

      # L-03: C++23. Compila um fragmento minimo para provar o padrao,
      # nao apenas a versao impressa pelo compilador.
      - name: Padrao C++23 aceito
        run: |
          set -eux
          cat > /tmp/c23.cpp <<'CPP'
          #include <cstdio>
          constexpr int f() { if consteval { return 23; } else { return 0; } }
          int main() { static_assert(f() == 23); std::printf("c++%ld\n", __cplusplus); }
          CPP
          ${{ matrix.cc }} -std=c++23 -o /tmp/c23 /tmp/c23.cpp
          /tmp/c23

      # O ctest aqui cobre tambem o gate de consumo (consume_test), o de
      # embedding (embed_test, GODS_LAWS.md FIX-CONSUMO achados
      # A2/A3/A4/A6/A7), o de decisao de colocacao de DLL embutida
      # (embed_dll_colocation_test, EMBED-DLL - roda aqui tambem, nao so
      # no Windows, porque nao tem dependencia de SO nenhuma), o de
      # CMAKE_INSTALL_INCLUDEDIR nao-default (install_includedir_test,
      # FIX-CONSUMO-2 achado QA-1), o de layout de empacotador Debian-
      # multiarch (install_packager_layout_test, FIX-CONSUMO-2 achado
      # QA-4; FIX-CONSUMO-3 secao 5: agora tambem prova o caminho
      # zero-flag nativamente onde o compilador reporta arquitetura
      # multiarch), o de colisao de nome de alvo (no_target_collision_test,
      # FIX-CONSUMO-2 achado QA-3) e o de OUTPUT_NAME/link cru
      # (output_name_test, FIX-CONSUMO-3 achado QA-2-2): todos foram
      # registrados em tests/CMakeLists.txt e rodam sob QUALQUER modo em
      # que este build/ tenha sido configurado, o que e exatamente o
      # eixo shared/static que matrix.modo agora exercita como entradas
      # separadas, nao mais como dois passos da mesma entrada (CI-CONSUME).
      # -DGLINTFX_WERROR=ON: GODS_LAWS.md L-23 portao 1 ("zero aviso de
      # compilacao em todo commit"), em todo build deste job a partir do
      # FUND-4 - ausente ate aqui (cmake/GlintfxOptions.cmake:11 tinha o
      # default OFF e nenhum passo deste arquivo o ligava).
      - name: Build e testes (${{ matrix.modo }})
        run: |
          set -eux
          cmake -S . -B ${{ matrix.builddir }} -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cc }} ${{ matrix.shared_flag }} -DGLINTFX_WERROR=ON
          cmake --build ${{ matrix.builddir }}
          ctest --test-dir ${{ matrix.builddir }} --output-on-failure

  windows:
    name: Windows - ${{ matrix.modo }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Duas entradas, nao mais dois passos dentro de uma - mesma
          # razao do job `linux` acima (CI-CONSUME).
          - modo: compartilhado
            builddir: build-shared
            shared_flag: ""
          - modo: estatico
            builddir: build-static
            shared_flag: "-DBUILD_SHARED_LIBS=OFF"
    steps:
      - uses: actions/checkout@v4

      - name: Versoes da toolchain
        shell: pwsh
        run: cmake --version

      # PKG-WIN-SCOPE: passo PERMANENTE, independente de matrix.builddir
      # (roda identico nas duas entradas, como "Padrao C++23 aceito"
      # abaixo) - colhe dado sobre pkg-config/pkgconf neste executor e
      # NUNCA falha o job (sempre exit 0 dentro do proprio script). Fica
      # mesmo com glintfx.pc desinstalado do Windows: e o que transforma
      # a proxima pergunta sobre pkg-config no Windows em leitura de log,
      # nao em quarta adivinhacao.
      - name: Diagnostico pkg-config no Windows (${{ matrix.modo }})
        shell: pwsh
        run: tools/ci/diagnose-win-pkgconfig.ps1

      # Sem action de terceiro: o proprio CMake localiza o MSVC. Sonda
      # independente de modo (nao usa glintfx, nao le matrix.builddir);
      # roda uma vez por entrada de matriz agora, nao mais uma vez por
      # job - custo aceito da independencia (CI-CONSUME).
      - name: Padrao C++23 aceito
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path probe | Out-Null
          @'
          #include <cstdio>
          constexpr int f() { if consteval { return 23; } else { return 0; } }
          int main() { static_assert(f() == 23); std::printf("ok\n"); }
          '@ | Set-Content probe/main.cpp
          @'
          cmake_minimum_required(VERSION 3.25)
          project(probe CXX)
          set(CMAKE_CXX_STANDARD 23)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          add_executable(probe main.cpp)
          '@ | Set-Content probe/CMakeLists.txt
          cmake -S probe -B probe/build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build probe/build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Get-ChildItem -Recurse -Filter probe.exe probe/build)[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -Recurse -Force probe

      # ctest aqui roda apenas os testes da propria arvore: consume_test/
      # embed_test/embed_dll_colocation_test's shell-dependent siblings
      # sao POSIX sh e nao compilados neste job (tests/CMakeLists.txt
      # guarda a maioria com if(UNIX); embed_dll_colocation_test e a
      # excecao PURPOSEFUL sem if(UNIX) - roda aqui tambem, ver
      # tests/CMakeLists.txt), por isso os passos "Consumo instalado" e
      # "Consumo embutido" abaixo fecham o caminho de consumo do Windows
      # com um script dedicado cada um (GODS_LAWS.md FIX-CONSUMO,
      # achados A2/A3: o caminho dllimport so existe fora da arvore; e
      # achado A7/FIX-CONSUMO-2 achado QA-2 para o embedding - CI-CONSUME
      # fechou a lacuna em que embed_test so tinha equivalente Linux).
      # -DGLINTFX_WERROR=ON: GODS_LAWS.md L-23 portao 1. No MSVC,
      # cmake/GlintfxCompileOptions.cmake ja mapeia esta mesma flag para
      # /WX (avisos como erro) - nao ha um segundo flag /WX a passar aqui.
      - name: Build (${{ matrix.modo }})
        shell: pwsh
        run: |
          cmake -S . -B ${{ matrix.builddir }} -DCMAKE_BUILD_TYPE=Release ${{ matrix.shared_flag }} -DGLINTFX_WERROR=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build ${{ matrix.builddir }} --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # WIN-HANG: colhe evidencia real do runner (localizacao do .dll x
      # .exe, execucao direta com limite de tempo proprio) ANTES do
      # ctest tentar rodar version_test.exe - GODS_LAWS.md L-27, fato
      # antes de conserto. Nunca falha o job por si so; o passo de teste
      # seguinte e que decide passa/falha, agora limitado por
      # DART_TESTING_TIMEOUT (cmake/GlintfxTest.cmake) em vez do default
      # de 1500s do CTest. Roda para os dois modos agora (antes so
      # existia para o compartilhado): o estatico nunca tinha este
      # diagnostico, e um hang la seria tao real quanto no compartilhado.
      - name: Diagnostico Windows - layout de runtime (${{ matrix.modo }})
        shell: pwsh
        run: tools/ci/diagnose-win-runtime.ps1 -BuildDir ${{ matrix.builddir }}

      - name: Testes (${{ matrix.modo }})
        shell: pwsh
        run: |
          ctest --test-dir ${{ matrix.builddir }} -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Consumo instalado (${{ matrix.modo }})
        id: consumo_instalado
        shell: pwsh
        run: tools/ci/check-consume.ps1 -BuildDir ${{ matrix.builddir }} -PackageSrcDir tests/package

      # PKG-WIN-SCOPE, revertido por ordem do lider (27/08/2026): regression
      # gate for CMakeLists.txt calling glintfx_install_pkgconfig()/
      # glintfx_register_pkgconfig_validation() unconditionally again (the
      # if(UNIX) guard that used to protect "pkg-config has no role in
      # glintfx's Windows story today" is gone - see PACKAGING.md,
      # "Packaging on Windows"). Reads the SAME prefix the step above just
      # installed into (its `prefix` output), instead of installing a
      # second one - this is the whole reason that step now exposes it.
      - name: Com pkg-config no prefixo Windows (${{ matrix.modo }})
        shell: pwsh
        run: tools/ci/check-pkgconfig-installed.ps1 -InstalledPrefix "${{ steps.consumo_instalado.outputs.prefix }}"

      # Windows equivalent of tests/tools/check_embed.sh (embed_test,
      # UNIX-only in tests/CMakeLists.txt) - proves add_subdirectory
      # consumption, not just the installed package above. Its own
      # configure is independent of BuildDir/BUILD_SHARED_LIBS (same
      # shape as check_embed.sh's configure_embed(), which does not
      # inherit the parent build's mode either), so this step's outcome
      # does not vary between matrix.modo entries - it runs once per
      # entry regardless, mirroring embed_test's own execution shape on
      # Linux, where ctest registers and runs it once per configure
      # (build-shared and build-static) even though its result does not
      # depend on either mode.
      - name: Consumo embutido (${{ matrix.modo }})
        shell: pwsh
        run: tools/ci/check-embed.ps1 -GlintfxSourceDir . -EmbedSrcDir tests/embed

  # GODS_LAWS.md L-09 / TEST-WLCONT: prova, em CI, que o container de
  # teste com compositor Wayland dentro (tests/container/) e a mesma
  # imagem que roda localmente e que ela isola de verdade a superficie
  # do lider - nunca monta o XDG_RUNTIME_DIR nem o wayland-0 do host,
  # nunca monta /dev/uinput, nunca fala X11 (L-05). Bloqueante como os
  # demais jobs (L-18): job que nao consegue ficar verde nao entra no
  # push.
  wayland-container:
    name: Container Wayland isolado (TEST-WLCONT, L-09)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Marca o inicio do build da imagem
        id: build_image
        run: echo "inicio=$(date +%s)" >> "$GITHUB_OUTPUT"

      # Imagem construida sob demanda, com cache de camadas no cache
      # de Actions do proprio GitHub (`type=gha`) - decisao do CTO:
      # sem registry externo. `load: true` poe a imagem no daemon
      # docker local do runner, porque os passos seguintes falam com
      # ela via `docker run`/`docker exec`, nao via `docker push`.
      - uses: docker/build-push-action@v6
        with:
          context: tests/container
          file: tests/container/Containerfile
          tags: glintfx-wltest:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tempo de build da imagem
        run: |
          set -eu
          fim=$(date +%s)
          echo "tempo de build da imagem: $((fim - ${{ steps.build_image.outputs.inicio }}))s"

      # Fato medido ao vivo contra esta mesma imagem, nao suposto: o
      # kwin_wayland do Fedora carrega a capability de arquivo
      # cap_sys_nice=ep (`getcap /usr/bin/kwin_wayland`), e um
      # `docker run` default nao concede CAP_SYS_NICE - sem ela o
      # dbus-run-session falha o exec do kwin_wayland com "Operation
      # not permitted" antes mesmo de o compositor subir.
      # --cap-drop=ALL --cap-add=SYS_NICE (nao --cap-add puro): forma
      # estritamente menor, verificada ao vivo que ainda sobe o
      # compositor (revisao adversarial TEST-WLCONT, conserto 4). Nada
      # alem disso: sem --privileged, sem --pid=host, sem /dev/dri
      # (GODS_LAWS.md L-09 regra 4 - render por software, reproduzivel
      # em qualquer runner); check_isolation.sh confere esse HostConfig
      # exato por lista branca.
      - name: Sobe o compositor limpo (nenhuma montagem do host)
        run: |
          set -eux
          docker run -d --name glintfx-wltest-clean --cap-drop=ALL --cap-add=SYS_NICE glintfx-wltest:ci
          for _ in $(seq 1 30); do
            docker exec glintfx-wltest-clean pgrep -x kwin_wayland >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec glintfx-wltest-clean pgrep -x kwin_wayland

      # GODS_LAWS.md L-09 regra 5: provar o isolamento ANTES de
      # interagir. Este passo roda antes do smoke test de proposito.
      - name: Isolamento provado (controle positivo)
        run: tests/container/check_isolation.sh glintfx-wltest-clean glintfx-test

      - name: Smoke test - wayland-info dentro do container
        run: docker exec glintfx-wltest-clean smoke.sh glintfx-test

      # Tres controles negativos obrigatorios (revisao adversarial
      # TEST-WLCONT: FURO 1 montagem/device, FURO 2 --pid=host, FURO 3
      # padrao de barra final). Cada um TEM que ser acusado por
      # check_isolation.sh - se algum passar verde aqui, o proprio
      # gate esta quebrado (mesmo piso que tools/preci.sh --selftest
      # aplica aos seus proprios controles, GODS_LAWS.md L-23).
      # `docker create`, nunca `docker run`, de proposito: o
      # ENTRYPOINT jamais executa, entao mesmo o cenario mais perigoso
      # (--pid=host) nao chega a rodar processo nenhum - os tres
      # controles se apoiam so em `docker inspect`, o que
      # check_isolation.sh confere ANTES de qualquer `docker exec`.
      - name: Controle negativo 1 - montagem proibida (FURO 1/3)
        run: |
          set -eux
          docker create --name glintfx-wltest-poisoned-mount --cap-drop=ALL --cap-add=SYS_NICE \
            -v /tmp:/run/user/1000:ro glintfx-wltest:ci
          if tests/container/check_isolation.sh glintfx-wltest-poisoned-mount glintfx-test; then
            echo "ERRO: check_isolation.sh deveria ter acusado a montagem proibida" >&2
            exit 1
          fi
          echo "ok: montagem proibida foi acusada, como esperado"

      - name: Controle negativo 2 - device passado (FURO 1)
        run: |
          set -eux
          docker create --name glintfx-wltest-poisoned-device --cap-drop=ALL --cap-add=SYS_NICE \
            --device=/dev/uinput glintfx-wltest:ci
          if tests/container/check_isolation.sh glintfx-wltest-poisoned-device glintfx-test; then
            echo "ERRO: check_isolation.sh deveria ter acusado o --device proibido" >&2
            exit 1
          fi
          echo "ok: --device proibido foi acusado, como esperado"

      # O mais serio dos tres: sob --pid=host, um `pgrep` DENTRO do
      # container deixa de estar escopado ao container e passa a ver
      # todo o PID namespace do runner. `docker create` garante que
      # isso nunca chega a acontecer aqui - o container nunca inicia,
      # e o proprio HostConfig.PidMode="host" tem que bastar para
      # check_isolation.sh recusar antes de cogitar um `docker exec`.
      - name: Controle negativo 3 - --pid=host (FURO 2)
        run: |
          set -eux
          docker create --name glintfx-wltest-poisoned-pid --cap-drop=ALL --cap-add=SYS_NICE \
            --pid=host glintfx-wltest:ci
          if tests/container/check_isolation.sh glintfx-wltest-poisoned-pid glintfx-test; then
            echo "ERRO: check_isolation.sh deveria ter acusado --pid=host" >&2
            exit 1
          fi
          echo "ok: --pid=host foi acusado, como esperado"

      # Quarto controle negativo, achado de revisao adversarial pos-
      # ISO-BASELINE (a razao real da reescrita daquele portao):
      # `--security-opt systempaths=unconfined` nao mexe em nenhum dos
      # nove campos nomeados que os tres controles acima cobrem -
      # MaskedPaths e ReadonlyPaths (que ISO-BASELINE passou a medir
      # por CONTAGEM contra `nproc`, nao por lista fixa) sao os unicos
      # que se esvaziam quando o flag esta presente. O script antigo,
      # de antes do ISO-BASELINE, media isso por lista de campos
      # nomeados e dava exit 0 ("isolamento provado") com /proc/kcore
      # exposto - medido ao vivo pela revisao, nao suposto. Mesmo
      # padrao dos tres controles acima: `docker create`, nunca `docker
      # run` - o ENTRYPOINT nunca executa, o controle se apoia so em
      # `docker inspect`.
      - name: Controle negativo 4 - --security-opt systempaths=unconfined
        run: |
          set -eux
          docker create --name glintfx-wltest-poisoned-systempaths --cap-drop=ALL --cap-add=SYS_NICE \
            --security-opt systempaths=unconfined glintfx-wltest:ci
          if tests/container/check_isolation.sh glintfx-wltest-poisoned-systempaths glintfx-test; then
            echo "ERRO: check_isolation.sh deveria ter acusado --security-opt systempaths=unconfined" >&2
            exit 1
          fi
          echo "ok: --security-opt systempaths=unconfined foi acusado, como esperado"

      - name: Limpeza
        if: always()
        run: |
          docker rm -f glintfx-wltest-clean glintfx-wltest-poisoned-mount \
            glintfx-wltest-poisoned-device glintfx-wltest-poisoned-pid \
            glintfx-wltest-poisoned-systempaths || true

  lint:
    name: Lint (Fedora 44 - clang-format, clang-tidy, cppcheck)
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Instalar toolchain e ferramentas de lint
        run: >-
          dnf -y install gcc-c++ cmake ninja-build pkgconf-pkg-config git
          wayland-devel wayland-protocols-devel clang-tools-extra cppcheck

      - uses: actions/checkout@v4

      # GODS_LAWS.md L-23 portao 3 (analise estatica). Mesma logica de
      # estagio que tools/preci.sh roda localmente (TESTES.md T15.2) -
      # format, configure -Werror, build, clang-tidy, cppcheck, NOLINT.
      - name: preci.sh --lint-only
        run: |
          set -eux
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tools/preci.sh --lint-only

  sanitizer:
    name: Sanitizer (Fedora 44 - ASan/UBSan)
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      # libasan/libubsan: pacotes de RUNTIME, separados de gcc-c++ no
      # Fedora. gcc-c++ traz so a copia interna em
      # /usr/lib/gcc/x86_64-redhat-linux/16/ (usada em tempo de
      # compilacao); o SONAME que o linker procura em tempo de link
      # (/usr/lib64/libasan.so.8.0.0, /usr/lib64/libubsan.so.1.0.0) vem
      # dos pacotes libasan/libubsan, que nunca foram instalados aqui -
      # confirmado ao vivo (`dnf provides '*/libasan.so*'`) reproduzindo
      # este job num container fedora:44 isolado, GODS_LAWS.md L-14.
      # Isto e toolchain do ambiente de build, nao dependencia da
      # biblioteca (L-07): nao muda o que glintfx linka em producao.
      - name: Instalar toolchain
        run: >-
          dnf -y install gcc-c++ cmake ninja-build pkgconf-pkg-config git
          wayland-devel wayland-protocols-devel libasan libubsan

      - uses: actions/checkout@v4

      # GODS_LAWS.md L-23 portao 2 ("ASan e UBSan a cada fatia fechada").
      # `ctest -L unit` apenas (dentro de tools/preci.sh): os gates de
      # consumo (LABELS consume, tests/CMakeLists.txt) linkam um
      # consumidor comum contra a lib sanitizada de proposito, o que
      # falha por construcao sob ASan - downgrade declarado, nao um
      # portao mais fraco escondido atras de um nome generico.
      - name: preci.sh --sanitizer-only
        run: |
          set -eux
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tools/preci.sh --sanitizer-only

  # Item CLANG-JOB da onda W2 (25/08/2026): honra a promessa de robustez
  # entre compiladores diferentes da GODS_LAWS.md L-22 (o motivo dela e
  # ABI: excecao atravessando .so exige RTTI compativel entre
  # compiladores) - ate aqui o CI so compilava com GCC (`linux`) e MSVC
  # (`windows`), nunca Clang. Fedora 44 apenas (mesmo raciocinio dos
  # jobs `lint`/`sanitizer` acima, que tambem so rodam la): achado de
  # COMPILADOR nao e especifico de distro, e um segundo eixo (Fedora x
  # Ubuntu x Arch x CachyOS) so multiplicaria o tempo de CI sem provar
  # nada novo. Duas entradas de matriz (compartilhado/estatico), mesma
  # forma CI-CONSUME dos jobs `linux`/`windows` acima - independentes,
  # nao passos sequenciais. -DGLINTFX_WERROR=ON: cmake/GlintfxCompileOptions.cmake
  # ja trata Clang igual a GNU para -Wall/-Wextra/-Wpedantic/-Werror, sem
  # ramo por-compilador a manter aqui - medido em container fedora:44
  # antes deste job existir: os DOIS modos compilam limpos, zero aviso.
  clang:
    name: Clang (Fedora 44 - segundo compilador, ${{ matrix.modo }})
    runs-on: ubuntu-latest
    container: fedora:44
    strategy:
      fail-fast: false
      matrix:
        include:
          - modo: compartilhado
            builddir: build-shared
            shared_flag: ""
          - modo: estatico
            builddir: build-static
            shared_flag: "-DBUILD_SHARED_LIBS=OFF"
    steps:
      - name: Instalar toolchain
        run: >-
          dnf -y install clang cmake ninja-build pkgconf-pkg-config git
          wayland-devel wayland-protocols-devel

      - uses: actions/checkout@v4

      - name: Versao do Clang
        run: clang++ --version

      - name: Build (${{ matrix.modo }})
        run: |
          set -eux
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -S . -B ${{ matrix.builddir }} -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ ${{ matrix.shared_flag }} -DGLINTFX_WERROR=ON
          cmake --build ${{ matrix.builddir }}

      # DOWNGRADE DECLARADO, mesmo padrao do job `sanitizer` acima (nao
      # um portao mais fraco escondido atras de nome generico): so
      # `ctest -L unit`, nao a suite inteira. Achado REAL, medido em
      # container fedora:44 (nao suposto, nunca corrigido aqui - fora de
      # escopo desta fatia, GODS_LAWS.md L-12: quem escreve o job de CI
      # nao conserta codigo de produto ou teste no mesmo commit): dois
      # gates de CONSUMO (install_packager_layout_test, pkgconfig_test -
      # LABELS consume, tests/CMakeLists.txt) reprovam sob Clang neste
      # alvo, e o GCC do MESMO container passa nos dois. Causa raiz
      # confirmada por medicao direta (nao suposicao): (1)
      # install_packager_layout_test - CMake auto-detecta
      # CMAKE_LIBRARY_ARCHITECTURE=x86_64-redhat-linux-gnu para o Clang
      # do Fedora (o GCC do MESMO Fedora nao reporta arquitetura
      # nenhuma - e por isso que o "hinted scenario" do teste sempre
      # bastava ate aqui), e esse valor auto-detectado sobrepoe o hint
      # explicito (`-DCMAKE_LIBRARY_ARCHITECTURE=x86_64-linux-gnu`) que
      # check_install_packager_layout.sh passa para o consumidor -
      # find_package procura em lib/x86_64-redhat-linux-gnu/cps/ em vez
      # de lib/x86_64-linux-gnu/cmake/, onde o pacote foi instalado. (2)
      # pkgconfig_test - o controle negativo de Libs.private
      # (assert_probe_links_without_wayland_client_fails,
      # tests/tools/check_pkgconfig.sh) linka a sonda SEM
      # -lwayland-client e espera falha por simbolo indefinido; sob GCC
      # falha como esperado, sob Clang o link "sucede" sem nenhum
      # simbolo wl_* no binario final (confirmado por readelf/nm: o
      # membro do arquivo estatico que contem xdg_wm_base_interface
      # nunca chega a ser extraido do .a) - o proprio premissa da sonda
      # ("referenciar este simbolo forca a extracao") nao se sustenta
      # sob este compilador. Nenhum dos dois e defeito de PRODUTO
      # (nenhuma linha de src/ ou include/ envolvida) - sao suposicoes
      # de infraestrutura de teste que valiam sob GCC e nao sob Clang.
      # Achados reportados na tabela de pendencias, nao consertados
      # aqui - ver TODO.md, item CLANG-JOB.
      - name: ctest -L unit (${{ matrix.modo }})
        run: |
          set -eux
          ctest --test-dir ${{ matrix.builddir }} -L '^unit$' --output-on-failure

  gitleaks:
    name: Gitleaks (scan de segredo)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: `gitleaks detect` (sem flags) varre o git log
      # inteiro por padrao (verificado ao vivo nesta versao, 8.30.0 - ver
      # .gitleaksignore); o checkout raso default (profundidade 1) so
      # exporia o ultimo commit ao scanner, dando falsa sensacao de
      # cobertura completa.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        run: sudo apt-get update && sudo apt-get install -y gitleaks

      # GODS_LAWS.md L-23 portao 4. .gitleaksignore na raiz supre os dois
      # falsos positivos conhecidos (a chave de exemplo de CONTRACT.md
      # 7.1, documentacao do que NAO fazer) por fingerprint de commit -
      # nenhum termo generico e ignorado.
      - name: gitleaks detect
        run: gitleaks detect --no-banner --source .

  leis:
    name: Gate das leis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GODS_LAWS.md L-05 (Wayland puro) e L-06 (parser de keymap
      # proprio). Logica extraida para tests/tools/check_no_x11.sh
      # (GODS_LAWS.md L-40, piso de varredura nao-vazia: a versao
      # anterior, embutida aqui, saia verde com varredura vazia e nao
      # cobria tools/ nem este proprio diretorio .github/ - ver o
      # cabecalho do script para os tres achados e --selftest para os
      # quatro controles que provam o gate). O nome deste passo e este
      # comentario evitam citar os termos proibidos por extenso de
      # proposito: eles moram so no script, o unico arquivo
      # autoexcluido da propria varredura (ver SELF_PATH_SUFFIX ali).
      - name: Gate L-05/L-06 - nenhum termo proibido no repositorio
        run: sh tests/tools/check_no_x11.sh "$PWD"

      # GODS_LAWS.md L-08 (publico no GitHub, AGPL-3.0) e L-40 (piso de
      # varredura nao-vazia). Item SPDX-GATE da onda W2, 25/08/2026:
      # entre este portao e o de ancora morta nos manuais, o lider
      # escolheu SO este - arquivo de codigo/build nascido sem cabecalho
      # SPDX enfraquece a licenca perante quem consome a lib de fora
      # (LEI ZERO), o que e dano juridico, nao cosmetico. Logica em
      # tests/tools/check_spdx.sh (enumeracao fechada via `git ls-files`,
      # excecao curta e nomeada, nunca busca dirigida - ver o cabecalho
      # do script). `sh`, nao `bash`: este job roda em ubuntu-latest, cujo
      # /bin/sh e dash - o mesmo motivo que levou o Gate L-05/L-06 acima a
      # ser invocado assim, e o mesmo bashismo que quebrou dois portoes
      # novos em tres dos cinco alvos nesta mesma semana (ver CLAUDE.md,
      # "Estado atual do repositorio").
      - name: Gate L-08 - cabecalho SPDX presente em todo arquivo nao isento
        run: sh tests/tools/check_spdx.sh "$PWD"

      - name: Gate L-08 - selftest (quatro controles, GODS_LAWS.md L-40)
        run: sh tests/tools/check_spdx.sh --selftest
