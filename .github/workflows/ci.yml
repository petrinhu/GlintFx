# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

# Cinco alvos distintos, por ordem do lider (GODS_LAWS.md, L-04):
# Fedora, Ubuntu, CachyOS, Arch e Windows.
# Fedora 44 e o ALVO PRIMARIO: e o sistema que o lider usa. Fica pinado
# na versao dele, nao em :latest, para o CI falhar quando a maquina dele
# falharia. Os demais alvos sao de portabilidade.
# CachyOS NAO e coberto pelo job de Arch: imagem propria, repositorios
# proprios, toolchain propria. Verde no Arch nao autoriza declarar
# CachyOS suportado.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: ${{ matrix.nome }}
    runs-on: ubuntu-latest
    container: ${{ matrix.imagem }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: Fedora 44 (primario)
            cc: c++
            imagem: fedora:44
            instalar: >-
              dnf -y install gcc-c++ cmake ninja-build pkgconf-pkg-config git
              wayland-devel wayland-protocols-devel
          # O g++ padrao do 24.04 e o 13.3, que da C++23 parcial
          # (__cplusplus=202100, sem <print>). Piso de toolchain do projeto
          # e GCC 14, medido em 21/08/2026: 14.2 devolve 202302.
          - nome: Ubuntu
            imagem: ubuntu:24.04
            cc: g++-14
            instalar: >-
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y
              g++-14 cmake ninja-build pkg-config git ca-certificates
              libwayland-dev libwayland-bin wayland-protocols
          - nome: Arch
            cc: c++
            imagem: archlinux:latest
            instalar: >-
              pacman -Syu --noconfirm gcc cmake ninja pkgconf git
              wayland wayland-protocols
          - nome: CachyOS
            cc: c++
            imagem: cachyos/cachyos:latest
            instalar: >-
              pacman -Syu --noconfirm gcc cmake ninja pkgconf git
              wayland wayland-protocols
    steps:
      - name: Instalar toolchain
        run: ${{ matrix.instalar }}

      - uses: actions/checkout@v4

      - name: Versoes da toolchain
        run: |
          set -eux
          ${{ matrix.cc }} --version
          cmake --version
          ninja --version
          pkg-config --modversion wayland-client
          pkg-config --modversion wayland-protocols
          wayland-scanner --version

      # L-05: Linux e Wayland puro. Sem xdg-shell.xml nao se abre janela,
      # entao a ausencia dele e falha de ambiente, nao detalhe.
      - name: Protocolos Wayland presentes
        run: |
          set -eu
          xml="$(pkg-config --variable=pkgdatadir wayland-protocols)/stable/xdg-shell/xdg-shell.xml"
          test -f "$xml" || { echo "FALTA xdg-shell.xml em $xml"; exit 1; }
          echo "ok: $xml"

      # L-03: C++23. Compila um fragmento minimo para provar o padrao,
      # nao apenas a versao impressa pelo compilador.
      - name: Padrao C++23 aceito
        run: |
          set -eux
          cat > /tmp/c23.cpp <<'CPP'
          #include <cstdio>
          constexpr int f() { if consteval { return 23; } else { return 0; } }
          int main() { static_assert(f() == 23); std::printf("c++%ld\n", __cplusplus); }
          CPP
          ${{ matrix.cc }} -std=c++23 -o /tmp/c23 /tmp/c23.cpp
          /tmp/c23

      # Modo compartilhado (default, BUILD_SHARED_LIBS=ON). O ctest aqui
      # cobre tambem o gate de consumo (consume_test), o de embedding
      # (embed_test, GODS_LAWS.md FIX-CONSUMO achados A2/A3/A4/A6/A7), o
      # de CMAKE_INSTALL_INCLUDEDIR nao-default (install_includedir_test,
      # FIX-CONSUMO-2 achado QA-1), o de layout de empacotador Debian-
      # multiarch (install_packager_layout_test, FIX-CONSUMO-2 achado
      # QA-4; FIX-CONSUMO-3 secao 5: agora tambem prova o caminho
      # zero-flag nativamente onde o compilador reporta arquitetura
      # multiarch), o de colisao de nome de alvo (no_target_collision_test,
      # FIX-CONSUMO-2 achado QA-3) e o de OUTPUT_NAME/link cru
      # (output_name_test, FIX-CONSUMO-3 achado QA-2-2): todos foram
      # registrados em tests/CMakeLists.txt e rodam sob QUALQUER modo em
      # que este build/ tenha sido configurado, o que e exatamente o
      # eixo shared/static que este job precisa exercitar.
      - name: Build e testes (compartilhado)
        run: |
          set -eux
          cmake -S . -B build-shared -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cc }}
          cmake --build build-shared
          ctest --test-dir build-shared --output-on-failure

      # Mesmo eixo de testes, agora com BUILD_SHARED_LIBS=OFF: prova que
      # o modo estatico tambem instala, exporta e e consumido por
      # find_package (GODS_LAWS.md FIX-CONSUMO, escopo item 2).
      - name: Build e testes (estatico)
        run: |
          set -eux
          cmake -S . -B build-static -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cc }} -DBUILD_SHARED_LIBS=OFF
          cmake --build build-static
          ctest --test-dir build-static --output-on-failure

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versoes da toolchain
        shell: pwsh
        run: cmake --version

      # Sem action de terceiro: o proprio CMake localiza o MSVC.
      - name: Padrao C++23 aceito
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path probe | Out-Null
          @'
          #include <cstdio>
          constexpr int f() { if consteval { return 23; } else { return 0; } }
          int main() { static_assert(f() == 23); std::printf("ok\n"); }
          '@ | Set-Content probe/main.cpp
          @'
          cmake_minimum_required(VERSION 3.25)
          project(probe CXX)
          set(CMAKE_CXX_STANDARD 23)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          add_executable(probe main.cpp)
          '@ | Set-Content probe/CMakeLists.txt
          cmake -S probe -B probe/build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build probe/build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Get-ChildItem -Recurse -Filter probe.exe probe/build)[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -Recurse -Force probe

      # Modo compartilhado (default). ctest aqui roda apenas os testes da
      # propria arvore: consume_test/embed_test sao POSIX sh e nao
      # compilados neste job (tests/CMakeLists.txt guarda os dois com
      # if(UNIX)), por isso o passo seguinte fecha o caminho de consumo
      # do Windows com um script dedicado (GODS_LAWS.md FIX-CONSUMO,
      # achados A2/A3: o caminho dllimport so existe fora da arvore).
      - name: Build e testes (compartilhado)
        shell: pwsh
        run: |
          cmake -S . -B build-shared -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-shared --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-shared -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Consumo instalado (compartilhado)
        shell: pwsh
        run: tools/ci/check-consume.ps1 -BuildDir build-shared -PackageSrcDir tests/package

      # Mesmo eixo de testes, agora com BUILD_SHARED_LIBS=OFF (escopo
      # item 2 desta onda).
      - name: Build e testes (estatico)
        shell: pwsh
        run: |
          cmake -S . -B build-static -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-static --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-static -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Consumo instalado (estatico)
        shell: pwsh
        run: tools/ci/check-consume.ps1 -BuildDir build-static -PackageSrcDir tests/package

  leis:
    name: Gate das leis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # L-05 (sem X11) e L-06/L-07 (parser de keymap proprio, dependencia zero).
      # Varre so diretorio de codigo; a documentacao cita os termos de proposito.
      - name: Sem X11 e sem libxkbcommon no codigo
        run: |
          set -eu
          dirs=""
          for d in src include tests examples demos cmake; do
            [ -d "$d" ] && dirs="$dirs $d"
          done
          if [ -z "$dirs" ]; then
            echo "Sem diretorio de codigo neste commit: nada a varrer."
            exit 0
          fi
          proibidos='Xlib\.h|xcb/|XOpenDisplay|XTestFake|xkbcommon'
          if grep -rInE "$proibidos" $dirs; then
            echo "PROIBIDO: ver GODS_LAWS.md L-05 (Wayland puro) e L-06 (parser de keymap proprio)."
            exit 1
          fi
          echo "ok: nenhuma ocorrencia."
